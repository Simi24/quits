name: CI

on:
  pull_request:
  workflow_dispatch:
  # The deploy workflow runs the same gate before it ships (SPEC.md §11.4).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Domain and script tests
        run: npm test
      - name: Worker tests
        run: npm run test:worker
      - name: Build
        run: npm run build
      - name: Performance budget (blocking)
        run: npm run budget
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Playwright smoke and axe (blocking)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
