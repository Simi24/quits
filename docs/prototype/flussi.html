<!doctype html>
<html lang="it" data-variant="ombrellone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flussi di Quits</title>
<!--
  PROTOTIPO USA E GETTA (issue Simi24/quits#9). Dati finti in memoria: ricaricare azzera tutto.
  Risponde a: come si presentano e scorrono i flussi principali di Quits sul telefono,
  in tre varianti della direzione "Cartolina d'estate" (issue #4).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Bagel+Fat+One&family=Onest:wght@400;500;600;700&family=Bowlby+One&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-width app column (390px) centred on a desk, with the prototype controls beside it; full-screen on a phone.
   Shape rule: interactive controls are pills; inputs 14px; sheets 28px top corners; receipts have zig-zag edges and no radius. */

/* Variant "Ombrellone" (default, coral leads) - light */
:root, :root[data-variant="ombrellone"] {
  color-scheme: light;
  --f-display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-text: "Figtree", "Segoe UI", "Helvetica Neue", sans-serif;
  --d-wght: 800; --d-track: -0.025em; --d-scale: 1; --d-opsz: "opsz" 96;
  --desk: #F3DCCB; --paper: #FBEBDD; --paper-2: #F5DCC8; --receipt: #FFFAF4;
  --ink: #1E2638; --ink-2: #5E5A6A; --line: #E6CDB9;
  --lead: #F0644C; --lead-deep: #C2412C; --on-lead: #1E2638;
  --hi: #FFC53D; --on-hi: #1E2638;
  --coral: #F0644C; --sun: #FFC53D; --pool: #2EA3D6; --leaf: #6DB36B; --sea: #3CC0B0; --stone: #B7A79B;
  --pos: #0E7095; --neg: #B9402B; --stamp: #D9472F; --ticket: #FFE3A3;
}
:root[data-variant="piscina"] {
  --f-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-text: "Onest", "Segoe UI", "Helvetica Neue", sans-serif;
  --d-wght: 400; --d-track: 0; --d-scale: .94; --d-opsz: normal;
  --desk: #DCE6E0; --paper: #EEF1EA; --paper-2: #DFE7E1; --receipt: #FCFDFA;
  --ink: #0E2F3E; --ink-2: #4A6672; --line: #CEDBD4;
  --lead: #1F9FD6; --lead-deep: #137BAA; --on-lead: #082431;
  --hi: #FFD04A; --on-hi: #0E2F3E;
  --coral: #FF6B57; --sun: #FFD04A; --pool: #1F9FD6; --leaf: #49A86F; --sea: #2BB7A6; --stone: #9AAAA3;
  --pos: #0A6B91; --neg: #C03E2B; --stamp: #1479A8; --ticket: #FFEFBF;
}
:root[data-variant="saluti"] {
  --f-display: "Bowlby One", "Arial Black", "Trebuchet MS", sans-serif;
  --f-text: "Atkinson Hyperlegible Next", "Segoe UI", "Helvetica Neue", sans-serif;
  --d-wght: 400; --d-track: .005em; --d-scale: .84; --d-opsz: normal;
  --desk: #EED6A8; --paper: #F7E4BF; --paper-2: #EFD6A6; --receipt: #FFF8E8;
  --ink: #1B2D5C; --ink-2: #4C5778; --line: #E3C996;
  --lead: #2443A0; --lead-deep: #172E73; --on-lead: #FFF3D6;
  --hi: #F6B826; --on-hi: #1B2D5C;
  --coral: #E95A3F; --sun: #F6B826; --pool: #3194D6; --leaf: #5C9E57; --sea: #2FA89A; --stone: #A9987A;
  --pos: #1C5FA8; --neg: #B23B24; --stamp: #E95A3F; --ticket: #D9E3F5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #1A1312; --paper: #241B1A; --paper-2: #2F2423; --receipt: #3A2D2B;
    --ink: #FCEBDD; --ink-2: #CDB7A9; --line: #4D3C39;
    --lead: #FF7A61; --lead-deep: #C4513C; --on-lead: #2A1512;
    --hi: #FFCC52; --on-hi: #2A1512;
    --coral: #FF7A61; --sun: #FFCC52; --pool: #5EC2EC; --leaf: #86C784; --sea: #5AD1C1; --stone: #9C8A80;
    --pos: #7FD3F5; --neg: #FF9A85; --stamp: #FF7A61; --ticket: #4A3826;
  }
  :root:not([data-theme="light"])[data-variant="piscina"] {
    --desk: #071A23; --paper: #0B2430; --paper-2: #0F2E3C; --receipt: #143A4B;
    --ink: #E4F3F7; --ink-2: #A3C4CF; --line: #22495A;
    --lead: #4EC6F2; --lead-deep: #2C93BB; --on-lead: #052230;
    --hi: #FFD84F; --on-hi: #0B2430;
    --coral: #FF8A76; --sun: #FFD84F; --pool: #4EC6F2; --leaf: #6CCB91; --sea: #4FD6C4; --stone: #7D99A3;
    --pos: #8EDCF8; --neg: #FFA192; --stamp: #4EC6F2; --ticket: #1F4D61;
  }
  :root:not([data-theme="light"])[data-variant="saluti"] {
    --desk: #0D1322; --paper: #131A2E; --paper-2: #192239; --receipt: #202B47;
    --ink: #F8EBCF; --ink-2: #C3BBA6; --line: #2E3A5A;
    --lead: #FFC534; --lead-deep: #C9961C; --on-lead: #131A2E;
    --hi: #FFC534; --on-hi: #131A2E;
    --coral: #FF7D63; --sun: #FFC534; --pool: #6DB7EE; --leaf: #8BC77F; --sea: #55CDBE; --stone: #8890A6;
    --pos: #93C8F5; --neg: #FF9C87; --stamp: #FF7D63; --ticket: #2C3B66;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #1A1312; --paper: #241B1A; --paper-2: #2F2423; --receipt: #3A2D2B;
  --ink: #FCEBDD; --ink-2: #CDB7A9; --line: #4D3C39;
  --lead: #FF7A61; --lead-deep: #C4513C; --on-lead: #2A1512;
  --hi: #FFCC52; --on-hi: #2A1512;
  --coral: #FF7A61; --sun: #FFCC52; --pool: #5EC2EC; --leaf: #86C784; --sea: #5AD1C1; --stone: #9C8A80;
  --pos: #7FD3F5; --neg: #FF9A85; --stamp: #FF7A61; --ticket: #4A3826;
}
:root[data-theme="dark"][data-variant="piscina"] {
  --desk: #071A23; --paper: #0B2430; --paper-2: #0F2E3C; --receipt: #143A4B;
  --ink: #E4F3F7; --ink-2: #A3C4CF; --line: #22495A;
  --lead: #4EC6F2; --lead-deep: #2C93BB; --on-lead: #052230;
  --hi: #FFD84F; --on-hi: #0B2430;
  --coral: #FF8A76; --sun: #FFD84F; --pool: #4EC6F2; --leaf: #6CCB91; --sea: #4FD6C4; --stone: #7D99A3;
  --pos: #8EDCF8; --neg: #FFA192; --stamp: #4EC6F2; --ticket: #1F4D61;
}
:root[data-theme="dark"][data-variant="saluti"] {
  --desk: #0D1322; --paper: #131A2E; --paper-2: #192239; --receipt: #202B47;
  --ink: #F8EBCF; --ink-2: #C3BBA6; --line: #2E3A5A;
  --lead: #FFC534; --lead-deep: #C9961C; --on-lead: #131A2E;
  --hi: #FFC534; --on-hi: #131A2E;
  --coral: #FF7D63; --sun: #FFC534; --pool: #6DB7EE; --leaf: #8BC77F; --sea: #55CDBE; --stone: #8890A6;
  --pos: #93C8F5; --neg: #FF9C87; --stamp: #FF7D63; --ticket: #2C3B66;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font-family: var(--f-text); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.display {
  font-family: var(--f-display); font-weight: var(--d-wght); letter-spacing: var(--d-track);
  font-variation-settings: var(--d-opsz); line-height: 1.05; text-wrap: balance;
}
.icon { width: 1.25em; height: 1.25em; flex: none; fill: currentColor; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- stage: desk + controls + device ---------- */
.stage {
  min-height: 100%; display: grid; grid-template-columns: minmax(0, 290px) 390px;
  justify-content: center; align-items: start; gap: 48px; padding: 24px 16px;
}
.device {
  position: relative; width: 390px; height: min(844px, calc(100dvh - 48px));
  border-radius: 44px; overflow: hidden; background: var(--paper);
  outline: 1.5px solid var(--line); isolation: isolate;
}
.proto { position: sticky; top: 24px; font-size: 14px; color: var(--ink); }
.proto summary { list-style: none; cursor: pointer; }
.proto summary::-webkit-details-marker { display: none; }
.proto-head { display: flex; align-items: center; gap: 10px; }
@media (min-width: 761px) { .proto-head .small { display: none; } .proto summary { cursor: default; } }
.proto-head b { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.proto-body { display: grid; gap: 22px; margin-top: 14px; }
.proto p { margin: 0; color: var(--ink-2); }
.proto h2 { font-size: 13px; font-weight: 700; margin: 0 0 8px; color: var(--ink-2); }
.vlist { display: grid; gap: 8px; }
.vopt {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
  padding: 10px 12px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper);
}
.vopt[aria-pressed="true"] { border-color: var(--ink); }
.vopt .sw { grid-row: span 2; display: flex; }
.vopt .sw i { width: 14px; height: 28px; display: block; }
.vopt .sw i:first-child { border-radius: 8px 0 0 8px; } .vopt .sw i:last-child { border-radius: 0 8px 8px 0; }
.vopt b { font-size: 15px; }
.vopt small { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.seg { display: flex; padding: 3px; gap: 3px; border-radius: 999px; background: var(--paper-2); }
.seg button { flex: 1; padding: 7px 10px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); text-align: center; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--receipt); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump button { padding: 6px 11px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; background: var(--paper); }
.jump button:hover { border-color: var(--ink-2); }
.tokens { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 10px; font-size: 12px; }
.tokens span { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tokens i { width: 14px; height: 14px; border-radius: 50%; flex: none; outline: 1px solid var(--line); }
.tokens code { font-family: inherit; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fontline { font-size: 12.5px; color: var(--ink-2); }

@media (max-width: 760px) {
  .stage { display: flex; flex-direction: column; height: 100%; padding: 0; gap: 0; }
  .device { width: 100%; flex: 1; height: auto; min-height: 0; border-radius: 0; outline: 0; }
  .proto { position: relative; top: 0; z-index: 30; background: var(--desk); padding: 8px 16px; border-bottom: 1.5px solid var(--line); }
  .proto[open] .proto-body { position: absolute; left: 0; right: 0; top: 100%; padding: 16px; max-height: 75dvh; overflow: auto; background: var(--desk); border-bottom: 1.5px solid var(--line); margin: 0; }
  .proto-head b { font-size: 17px; }
}

/* ---------- app shell ---------- */
#app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; }
.pad { padding: 20px 16px 28px; }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }
h1, h2, h3, p { margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 16px;
  background: var(--lead); color: var(--on-lead); box-shadow: 0 3px 0 var(--lead-deep);
  transition: transform .18s cubic-bezier(.3,.7,.4,1.4), box-shadow .18s; white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--lead-deep); }
.btn:disabled { opacity: .45; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.btn.danger { background: var(--neg); color: var(--receipt); box-shadow: none; }
.btn.sm { min-height: 38px; padding: 0 15px; font-size: 14px; }
.link { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: var(--ink-2); }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; color: var(--ink); flex: none; }
.iconbtn:hover { background: var(--paper-2); }
.iconbtn .icon { width: 22px; height: 22px; }

.field { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.field > span { font-size: 14px; font-weight: 600; }
.input, .select {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--receipt); color: var(--ink);
}
.input::placeholder { color: var(--ink-2); opacity: .8; }
.input:focus, .select:focus { outline: none; border-color: var(--ink); }
.help { font-size: 13.5px; color: var(--ink-2); }
.err { font-size: 14px; color: var(--neg); font-weight: 600; display: flex; gap: 6px; align-items: flex-start; }
.err .icon { margin-top: 1px; }
.ok { font-size: 14px; color: var(--pos); font-weight: 600; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scrollx { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; padding-bottom: 4px; scrollbar-width: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--receipt);
  font-weight: 600; font-size: 15px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--receipt); }
.chip .emo { font-size: 17px; line-height: 1; }

/* ---------- brand: the "=" mark ---------- */
.eq { --w: 34px; --h: 7px; display: inline-grid; gap: calc(var(--h) * .9); width: var(--w); flex: none; }
.eq i { display: block; height: var(--h); border-radius: 999px; transition: transform .5s cubic-bezier(.3,.8,.3,1.3); }
.eq i:first-child { background: var(--hi); }
.eq i:last-child { background: var(--lead); }
.eq.open i:first-child { transform: translateX(30%) rotate(-9deg); }
.eq.open i:last-child { transform: translateX(-22%) rotate(7deg); }
.eq.mono i { background: currentColor; }
.wordmark { display: flex; align-items: center; gap: 12px; }
.wordmark .display { font-size: calc(30px * var(--d-scale)); }

/* ---------- receipts: the signature object ---------- */
.zz {
  --zz: 9px; background: var(--receipt); position: relative;
  -webkit-mask:
    conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(var(--zz) * 2) 51% repeat-x,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) 51% repeat-x;
          mask:
    conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(var(--zz) * 2) 51% repeat-x,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) 51% repeat-x;
}
.zz-b {
  --zz: 10px; background: var(--receipt);
  -webkit-mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - var(--zz)) no-repeat,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) var(--zz) repeat-x;
          mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - var(--zz)) no-repeat,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) var(--zz) repeat-x;
}
.edge { filter: drop-shadow(0 1.5px 0 var(--line)); }
.tear { border: 0; border-top: 2px dashed var(--line); margin: 0; }

.roll { display: grid; gap: 8px; }
.day { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 4px 8px; }
.day h3 { font-size: calc(19px * var(--d-scale)); }
.day span { font-size: 14px; color: var(--ink-2); }
.rc {
  display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center;
  width: 100%; padding: 20px 16px; text-align: left; color: var(--ink);
}
.rc:active { filter: brightness(.98); }
.cat-dot {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--cat, var(--stone)) 32%, var(--receipt)); font-size: 21px; line-height: 1;
}
.rc-desc { display: block; font-weight: 700; font-size: 16px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-meta { display: flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.rc-meta .icon { width: 15px; height: 15px; color: var(--neg); }
.ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-meta .tagline { flex: none; }
.rc-amt { text-align: right; }
.rc-amt b { display: block; font-size: 17px; font-weight: 700; }
.rc-amt small { display: block; font-size: 13px; color: var(--ink-2); }
.tagline { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: color-mix(in srgb, var(--pool) 22%, var(--receipt)); color: var(--ink); }

.ticket {
  --r: 10px; background: var(--ticket);
  -webkit-mask:
    radial-gradient(circle var(--r) at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--r) at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
          mask:
    radial-gradient(circle var(--r) at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--r) at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
  border-radius: 14px;
}
.tk {
  display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center;
  width: 100%; padding: 14px 20px; text-align: left;
}
.ticket .btn.ghost { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.tk .cat-dot { background: transparent; border: 2px dashed var(--ink-2); color: var(--ink); }
.tk .cat-dot .icon { width: 22px; height: 22px; }

@keyframes print { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } to { clip-path: inset(0 0 -20px 0); transform: none; } }
.print { animation: print .9s steps(9, end) both; }

/* ---------- trip chrome ---------- */
.tripbar { display: flex; align-items: center; gap: 4px; padding: 10px 8px 8px 4px; background: var(--paper); }
.tripbar h1 { font-size: calc(23px * var(--d-scale)); }
.tripbar p { font-size: 13.5px; color: var(--ink-2); }
.me-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--paper-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
.me-chip .icon { width: 16px; height: 16px; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); padding: 0 16px 6px; }
.sync .icon { width: 16px; height: 16px; }
.closedbar { display: flex; align-items: center; gap: 10px; margin: 0 16px 8px; padding: 10px 14px; border-radius: 14px; background: var(--paper-2); font-size: 14px; }

.tabbar {
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--paper); border-top: 1.5px solid var(--line);
}
.tabbar button { display: grid; justify-items: center; gap: 2px; padding: 4px 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tabbar .pill { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background .2s; }
.tabbar .icon { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] .pill { background: var(--hi); color: var(--on-hi); }
.fab {
  position: absolute; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
  background: var(--lead); color: var(--on-lead); box-shadow: 0 4px 0 var(--lead-deep);
  transition: transform .2s cubic-bezier(.3,.7,.4,1.5);
}
.fab .icon { width: 28px; height: 28px; }
.fab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lead-deep); }

.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 22px 18px 24px; }
.summary div + div { border-left: 2px dashed var(--line); padding-left: 16px; }
.summary small { display: block; font-size: 13.5px; color: var(--ink-2); }
.summary b { display: block; font-family: var(--f-display); font-weight: var(--d-wght); font-variation-settings: var(--d-opsz); letter-spacing: var(--d-track); font-size: calc(26px * var(--d-scale)); line-height: 1.15; }
.search { position: relative; }
.search .icon { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--ink-2); width: 18px; height: 18px; }
.search .input { padding-left: 40px; min-height: 44px; border-radius: 999px; }
.empty { text-align: center; padding: 34px 20px; display: grid; gap: 10px; justify-items: center; }

/* ---------- balances ---------- */
.hero-bal { padding: 26px 20px 30px; display: grid; gap: 8px; }
.hero-bal .display { font-size: calc(34px * var(--d-scale)); }
.bal-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 14px 4px; }
.bal-row + .bal-row { border-top: 1.5px solid var(--line); }
.bal-row b { font-size: 16px; }
.bal-row .words { font-size: 14px; color: var(--ink-2); }
.amt-pos { color: var(--pos); font-weight: 700; }
.amt-neg { color: var(--neg); font-weight: 700; }
.amt-zero { color: var(--ink-2); font-weight: 700; }
.sec-title { font-size: calc(20px * var(--d-scale)); margin: 8px 0 2px; }
.bar { height: 10px; border-radius: 999px; background: var(--cat, var(--stone)); min-width: 4px; }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--paper); }
.overlay.push-in { animation: push .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes push { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
.scrim { position: absolute; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 38%, transparent); display: flex; flex-direction: column; justify-content: flex-end; }
.scrim.fade-in { animation: fade .25s ease-out both; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  background: var(--paper); border-radius: 28px 28px 0 0; max-height: calc(100% - 28px);
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet.rise { animation: rise .55s cubic-bezier(.25,1.35,.45,1) both; }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px 18px; }
.sheet-head h2 { flex: 1; font-size: calc(22px * var(--d-scale)); }
.grabber { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 8px auto 0; }
.sheet-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1.5px solid var(--line); display: grid; gap: 8px; background: var(--paper); }
.amount-in { display: flex; align-items: baseline; gap: 8px; border-bottom: 2.5px solid var(--ink); padding-bottom: 4px; }
.amount-in input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-family: var(--f-display); font-weight: var(--d-wght); font-variation-settings: var(--d-opsz); font-size: calc(40px * var(--d-scale)); letter-spacing: var(--d-track); padding: 0; }
.amount-in input::placeholder { color: var(--ink-2); opacity: .45; }
.amount-in span { font-size: 22px; font-weight: 700; color: var(--ink-2); }
.split-rows { display: grid; gap: 2px; }
.srow { display: grid; grid-template-columns: minmax(0,1fr) 112px 92px; gap: 10px; align-items: center; min-height: 52px; }
.srow .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .res { text-align: right; font-size: 15px; }
.srow .res small { display: block; font-size: 12px; color: var(--pos); font-weight: 700; }
.srow .input { min-height: 42px; padding: 6px 10px; text-align: right; }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); border-radius: 999px; background: var(--receipt); height: 42px; }
.stepper button { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; }
.stepper .icon { width: 16px; height: 16px; }
.check { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--ink-2); }
.check[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--receipt); }
.check .icon { width: 18px; height: 18px; }
.check[aria-pressed="false"] .icon { visibility: hidden; }
.notice { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 14px; border-radius: 14px; background: color-mix(in srgb, var(--sun) 34%, var(--paper)); font-size: 14.5px; }
.notice .icon { color: var(--ink); margin-top: 2px; }

.detail-receipt { padding: 22px 20px 30px; display: grid; gap: 14px; }
.drow { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 15.5px; }
.drow .lead-dots { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-4px); min-width: 12px; }
.cent { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--pos) 18%, var(--receipt)); color: var(--pos); }
.ver { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; }
.ver + .ver { border-top: 1.5px solid var(--line); }

.toast {
  position: absolute; left: 16px; right: 16px; bottom: calc(164px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px;
  background: var(--ink); color: var(--paper); font-weight: 600; font-size: 15px;
  animation: toast .35s cubic-bezier(.25,1.3,.45,1) both;
}
.toast button { margin-left: auto; color: var(--hi); font-weight: 700; }
@keyframes toast { from { transform: translateY(16px); opacity: 0; } }
.rc:focus-visible, .tk:focus-visible, .trip-tk:focus-visible { outline-offset: -5px; }

/* ---------- "tutti pari" ---------- */
.pari { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 86%, transparent); }
.pari canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pari-ticket { position: relative; width: 300px; max-width: calc(100% - 32px); padding: 34px 24px 30px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.stamp {
  font-family: var(--f-display); font-weight: var(--d-wght); font-variation-settings: var(--d-opsz);
  font-size: calc(58px * var(--d-scale)); letter-spacing: .04em; line-height: 1; color: var(--stamp);
  padding: 10px 22px 8px; border: 5px solid var(--stamp); border-radius: 18px; outline: 2px solid var(--stamp); outline-offset: 4px;
  transform: rotate(-8deg);
}
.stamp.thunk { animation: thunk .5s cubic-bezier(.2,1.6,.4,1) both .1s; }
@keyframes thunk { from { transform: rotate(-8deg) scale(2.2); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
.stamp.small { font-size: calc(26px * var(--d-scale)); border-width: 3px; padding: 6px 12px 4px; border-radius: 10px; outline-width: 1.5px; outline-offset: 3px; }

/* ---------- landing ---------- */
.land-hero { padding: 30px 20px 26px; display: grid; gap: 18px; }
.land-hero .bigmark { display: flex; align-items: center; gap: 16px; }
.land-hero .bigmark .eq { --w: 74px; --h: 15px; }
.land-hero .bigmark .display { font-size: calc(76px * var(--d-scale)); line-height: .9; }
.land-hero p { font-size: 19px; line-height: 1.35; max-width: 30ch; }
.trip-tk { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; width: 100%; padding: 18px 22px; text-align: left; }
.trip-tk h3 { font-size: calc(21px * var(--d-scale)); }
.trip-tk .state { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); }
.trip-tk .state.open { background: color-mix(in srgb, var(--leaf) 30%, var(--receipt)); }
.who-list { display: grid; gap: 10px; }
.who-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 18px; border-radius: 999px; background: var(--receipt); border: 1.5px solid var(--line); font-weight: 700; font-size: 18px; }
.who-btn:hover { border-color: var(--ink-2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: color-mix(in srgb, var(--av) 40%, var(--receipt)); color: var(--ink); flex: none; }
.linkbox { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--receipt); border: 1.5px dashed var(--ink-2); font-size: 14px; }
.linkbox code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: inherit; font-weight: 600; }
.setting { display: grid; gap: 10px; padding: 18px 0; grid-template-columns: minmax(0, 1fr); }
.setting + .setting { border-top: 1.5px solid var(--line); }
.setting h3 { font-size: 17px; font-weight: 700; }
.plist { display: grid; }
.prow { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.prow + .prow { border-top: 1.5px dashed var(--line); }
.hist-row { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; padding: 12px 0; align-items: start; }
.hist-row + .hist-row { border-top: 1.5px solid var(--line); }
.hist-row .avatar { width: 32px; height: 32px; font-size: 13px; }
.hist-row time { font-size: 13px; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}
</style>

const STD = [
  { id: "alloggio", emoji: "🏠", color: "pool", it: "Alloggio", en: "Accommodation" },
  { id: "trasporti", emoji: "🚗", color: "sun", it: "Trasporti", en: "Transport" },
  { id: "ristoranti", emoji: "🍝", color: "coral", it: "Ristoranti", en: "Restaurants" },
  { id: "spesa", emoji: "🛒", color: "leaf", it: "Spesa", en: "Groceries" },
  { id: "attivita", emoji: "🤿", color: "sea", it: "Attività", en: "Activities" },
  { id: "altro", emoji: "📦", color: "stone", it: "Altro", en: "Other" },
];
const HASH_COLORS = ["pool", "sun", "coral", "leaf", "sea"];
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const catOf = (trip, id) => {
  const s = STD.find(c => c.id === id);
  if (s) return { id, emoji: s.emoji, name: s[S.lang], color: s.color };
  const c = trip.cats.find(c => c.id === id);
  if (c) return { id, emoji: c.emoji, name: c.name, color: HASH_COLORS[hash(c.id) % HASH_COLORS.length] };
  return catOf(trip, "altro");
};
const allCats = trip => [...STD.map(c => c.id), ...trip.cats.map(c => c.id)];

/* ================= domain: splits, balances, suggestions ================= */
// Largest remainder: integer minor units, ties broken by order of entry in the trip.
function alloc(total, ids, w) {
  const sg = total < 0 ? -1 : 1, A = Math.abs(total), W = w.reduce((a, b) => a + b, 0);
  if (!W) return { shares: {}, extra: [] };
  const rows = ids.map((id, i) => ({ id, i, w: w[i], fl: Math.floor((A * w[i]) / W), r: (A * w[i]) % W }));
  const rem = A - rows.reduce((a, x) => a + x.fl, 0);
  const order = rows.filter(x => x.w > 0).sort((a, b) => b.r - a.r || a.i - b.i);
  const extra = [];
  for (let k = 0; k < rem; k++) { order[k].fl++; extra.push(order[k].id); }
  const shares = {};
  rows.forEach(x => { if (x.w > 0) shares[x.id] = sg * x.fl; });
  return { shares, extra };
}
function sharesOf(tr, e) {
  const ids = tr.people.map(p => p.id), s = e.split;
  if (s.m === "exact") { const out = {}; ids.forEach(id => { if (s.a[id]) out[id] = Math.sign(e.amount || 1) * s.a[id]; }); return { shares: out, extra: [] }; }
  const w = ids.map(id => s.m === "equal" ? (s.among.includes(id) ? 1 : 0) : s.m === "shares" ? (s.w[id] || 0) : Math.round((s.p[id] || 0) * 100));
  return alloc(e.amount, ids, w);
}
const liveExps = tr => tr.exps.filter(e => !e.deleted);
const liveSets = tr => tr.sets.filter(s => !s.deleted);
function balances(tr) {
  const b = Object.fromEntries(tr.people.map(p => [p.id, 0]));
  for (const e of liveExps(tr)) {
    e.payers.forEach(([id, c]) => (b[id] += c));
    const { shares } = sharesOf(tr, e);
    for (const id in shares) b[id] -= shares[id];
  }
  for (const s of liveSets(tr)) { b[s.from] += s.c; b[s.to] -= s.c; }
  return b;
}
// Greedy, deterministic: largest debtor pays largest creditor; ties by order of entry. At most N-1 payments.
function suggest(tr) {
  const b = balances(tr), order = tr.people.map(p => p.id), out = [];
  const pos = id => order.indexOf(id);
  let guard = 0;
  while (guard++ < 50) {
    const cred = order.filter(id => b[id] > 0).sort((x, y) => b[y] - b[x] || pos(x) - pos(y));
    const debt = order.filter(id => b[id] < 0).sort((x, y) => b[x] - b[y] || pos(x) - pos(y));
    if (!cred.length || !debt.length) break;
    const c = cred[0], d = debt[0], x = Math.min(b[c], -b[d]);
    out.push({ from: d, to: c, c: x }); b[c] -= x; b[d] += x;
  }
  return out;
}
const usage = (tr, pid) => liveExps(tr).filter(e => e.payers.some(p => p[0] === pid) || sharesOf(tr, e).shares[pid] !== undefined).length + liveSets(tr).filter(s => s.from === pid || s.to === pid).length;

/* ---------- Spese: the roll of receipts ---------- */
function vSpese() {
  const tr = trip(), me = tr.me;
  const exps = liveExps(tr);
  const total = exps.reduce((a, e) => a + e.amount, 0);
  const mine = exps.reduce((a, e) => a + (sharesOf(tr, e).shares[me] || 0), 0);
  const q = S.q.trim().toLowerCase();
  const items = [
    ...exps.filter(e => !q || e.desc.toLowerCase().includes(q) || catOf(tr, e.cat).name.toLowerCase().includes(q)).map(e => ({ kind: "e", date: e.date, at: e.versions[0].at, x: e })),
    ...(q ? [] : liveSets(tr).map(s => ({ kind: "s", date: s.date, at: s.date + "T23:59", x: s }))),
  ].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.at < b.at ? 1 : -1));
  const days = [];
  items.forEach(it => { let d = days.find(d => d.date === it.date); if (!d) days.push((d = { date: it.date, items: [] })); d.items.push(it); });
  const roll = days.map(d => {
    const dayTotal = d.items.filter(i => i.kind === "e").reduce((a, i) => a + i.x.amount, 0);
    return `<div class="day"><h3 class="display">${esc(dDay(d.date))}</h3><span class="num">${d.items.some(i => i.kind === "e") ? fmt(dayTotal) : ""}</span></div>
      ${d.items.map(i => (i.kind === "e" ? rcItem(i.x) : tkItem(i.x))).join("")}`;
  }).join("");
  return `<div class="pad" style="padding-top:6px">
    <div class="zz edge summary"><div><small>${t("spentSoFar")}</small><b class="num">${fmt(total)}</b></div><div><small>${t("yourPart")}</small><b class="num">${fmt(mine)}</b></div></div>
    <div class="row" style="margin-top:14px"><div class="search grow">${ic("magnifying-glass")}<label class="sr" for="q">${t("searchPh")}</label><input id="q" class="input" data-in="q" value="${esc(S.q)}" placeholder="${t("searchPh")}" autocomplete="off"></div><button class="iconbtn" data-act="history" aria-label="${t("history")}" title="${t("history")}">${ic("clock-counter-clockwise")}</button></div>
    ${exps.length === 0 ? `<div class="empty"><div class="zz edge" style="width:120px;height:90px;display:grid;place-items:center">${ic("receipt")}</div><b>${t("emptyRoll")}</b><p class="muted small">${t("emptyRollHelp")}</p></div>` : q && !items.length ? `<div class="empty"><p class="muted">${esc(t("noResults", S.q))}</p></div>` : `<div class="roll">${roll}</div>`}
    <div style="height:70px"></div>
  </div>`;
}
function rcItem(e) {
  const tr = trip(), c = catOf(tr, e.cat), mine = sharesOf(tr, e).shares[tr.me];
  const refund = e.amount < 0;
  const p0 = nm(e.payers[0][0]);
  const who = e.payers.length > 1 ? t("paidByMany", p0, e.payers.length - 1) : refund ? t("receivedBy", p0) : t("paidBy", p0);
  return `<div class="edge"><button class="zz rc ${S.anim.print === e.id ? "print" : ""}" data-act="open-exp" data-id="${e.id}" style="--cat:var(--${c.color})">
    <span class="cat-dot" aria-hidden="true">${c.emoji}</span>
    <span style="min-width:0"><span class="rc-desc">${esc(e.desc)}</span><span class="rc-meta">${e.conflict ? ic("warning") : ""}${refund ? `<span class="tagline">${t("refund")}</span>` : ""}<span class="ell">${esc(who.charAt(0).toUpperCase() + who.slice(1))}</span></span></span>
    <span class="rc-amt num"><b>${fmt(e.amount)}</b><small>${mine !== undefined ? esc(t("yourShare", fmt(mine))) : t("notYours")}</small></span>
  </button></div>`;
}
function tkItem(s) {
  return `<div class="ticket"><button class="tk" data-act="open-set" data-id="${s.id}">

function vTotals() {
  const tr = trip(), exps = liveExps(tr);
  const total = exps.reduce((a, e) => a + e.amount, 0);
  const days = tr.from && tr.to ? Math.round((new Date(tr.to) - new Date(tr.from)) / 864e5) + 1 : 1;
  const heads = tr.dsplit.m === "shares" ? Object.values(tr.dsplit.w).reduce((a, b) => a + b, 0) : tr.people.length;
  const paid = {}, due = {};
  tr.people.forEach(p => { paid[p.id] = 0; due[p.id] = 0; });
  exps.forEach(e => { e.payers.forEach(([id, c]) => (paid[id] += c)); const s = sharesOf(tr, e).shares; for (const id in s) due[id] += s[id]; });
  const byCat = {};
  exps.forEach(e => (byCat[e.cat] = (byCat[e.cat] || 0) + e.amount));
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...cats.map(c => c[1]), 1);
  return `
    <div class="zz edge hero-bal"><small class="muted">${t("tripTotal")}</small><h2 class="display num">${fmt(total)}</h2>
      <p class="muted small">${esc(t("perDay", fmt(Math.round(total / days)), days))}</p>
      <p class="muted small">${esc(t("perHead", fmt(Math.round(total / days / heads))))}</p></div>
    <h2 class="display sec-title">${t("paidVsDue")}</h2>
    <div>${tr.people.map(p => `<div class="bal-row">${avatar(p.id)}<b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</b><div class="num" style="text-align:right;font-size:14.5px"><div><span class="muted">${t("paid")}</span> <b>${fmt(paid[p.id])}</b></div><div><span class="muted">${t("due")}</span> <b>${fmt(due[p.id])}</b></div></div></div>`).join("")}</div>
    <h2 class="display sec-title" style="margin-top:10px">${t("byCategory")}</h2>
    <div class="stack" style="gap:12px">${cats.map(([id, v]) => { const c = catOf(tr, id); return `<div style="--cat:var(--${c.color})"><div class="row small"><span>${c.emoji}</span><b class="grow">${esc(c.name)}</b><span class="num">${fmt(v)}</span></div><div class="bar" style="width:${Math.max(2, (Math.max(v, 0) / max) * 100)}%;margin-top:6px"></div></div>`; }).join("")}</div>
    <div style="height:10px"></div>`;
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--coral", "--sun", "--pool", "--leaf", "--sea"].map(k => cs.getPropertyValue(k).trim());
  const bits = Array.from({ length: 90 }, (_, i) => ({ x: r.width / 2, y: r.height * 0.42, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3, w: 6 + Math.random() * 6, h: 4 + Math.random() * 8, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length] }));
  const t0 = performance.now();
  (function frame(now) {
    const k = (now - t0) / 1600; g.clearRect(0, 0, r.width, r.height);
    if (k >= 1) return;
    bits.forEach(b => { b.vy += 0.28; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.a += b.va; g.save(); g.globalAlpha = 1 - k * k; g.translate(b.x, b.y); g.rotate(b.a); g.fillStyle = b.c; g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); g.restore(); });
    requestAnimationFrame(frame);
  })(t0);
}

/* ================= boot ================= */
(function boot() {
  try { const s = JSON.parse(localStorage.getItem("quits-proto") || "null"); if (s) Object.assign(S, { variant: s.variant || S.variant, theme: s.theme || S.theme, lang: s.lang || S.lang }); } catch (_) {}
  const h = (location.hash || "").slice(1);
  if (VARIANTS.some(v => v.id === h)) S.variant = h;
  applyLook();
  const proto = document.getElementById("proto");
  if (matchMedia("(min-width: 761px)").matches) proto.open = true;
  proto.querySelector && proto.addEventListener("click", ev => { if (ev.target.closest("summary") && matchMedia("(min-width: 761px)").matches) ev.preventDefault(); });
  render();
})();
</script>
</body>
</html>
