<!doctype html>
<html lang="it" data-variant="scelta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafici di Quits</title>
<!--
  PROTOTIPO USA E GETTA (issue Simi24/quits#10). Dati finti in memoria: ricaricare azzera tutto.
  Risponde a: come si presentano gli otto grafici del Modello di dominio (#5) sul telefono, dove stanno
  nella scheda Grafici, come si leggono in chiaro e scuro, e se servono librerie (qui: SVG a mano, nessuna).
  Stesse varianti, font, dati e colori delle categorie del prototipo dei flussi (#9), piu la variante Scelta.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Bagel+Fat+One&family=Onest:wght@400;500;600;700&family=Bowlby+One&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-width app column (390px) centred on a desk, with the prototype controls beside it; full-screen on a phone. Desktop mode widens the column to 760px and the charts go two by two.
   Shape rule (from the flows prototype): controls are pills; receipts have zig-zag edges and no radius; postcards 16px. */

/* Variant "Ombrellone" (default, coral leads) - light */
:root, :root[data-variant="ombrellone"] {
  color-scheme: light;
  --f-display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-text: "Figtree", "Segoe UI", "Helvetica Neue", sans-serif;
  --d-wght: 800; --d-track: -0.025em; --d-scale: 1; --d-opsz: "opsz" 96;
  --desk: #F3DCCB; --paper: #FBEBDD; --paper-2: #F5DCC8; --receipt: #FFFAF4;
  --ink: #1E2638; --ink-2: #5E5A6A; --line: #E6CDB9;
  --lead: #F0644C; --lead-deep: #C2412C; --on-lead: #1E2638;
  --hi: #FFC53D; --on-hi: #1E2638;
  --coral: #F0644C; --sun: #FFC53D; --pool: #2EA3D6; --leaf: #6DB36B; --sea: #3CC0B0; --stone: #B7A79B;
  --pos: #0E7095; --neg: #B9402B; --stamp: #D9472F; --ticket: #FFE3A3;
}
:root[data-variant="piscina"] {
  --f-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-text: "Onest", "Segoe UI", "Helvetica Neue", sans-serif;
  --d-wght: 400; --d-track: 0; --d-scale: .94; --d-opsz: normal;
  --desk: #DCE6E0; --paper: #EEF1EA; --paper-2: #DFE7E1; --receipt: #FCFDFA;
  --ink: #0E2F3E; --ink-2: #4A6672; --line: #CEDBD4;
  --lead: #1F9FD6; --lead-deep: #137BAA; --on-lead: #082431;
  --hi: #FFD04A; --on-hi: #0E2F3E;
  --coral: #FF6B57; --sun: #FFD04A; --pool: #1F9FD6; --leaf: #49A86F; --sea: #2BB7A6; --stone: #9AAAA3;
  --pos: #0A6B91; --neg: #C03E2B; --stamp: #1479A8; --ticket: #FFEFBF;
}
:root[data-variant="saluti"] {
  --f-display: "Bowlby One", "Arial Black", "Trebuchet MS", sans-serif;
  --f-text: "Atkinson Hyperlegible Next", "Segoe UI", "Helvetica Neue", sans-serif;
  --d-wght: 400; --d-track: .005em; --d-scale: .84; --d-opsz: normal;
  --desk: #EED6A8; --paper: #F7E4BF; --paper-2: #EFD6A6; --receipt: #FFF8E8;
  --ink: #1B2D5C; --ink-2: #4C5778; --line: #E3C996;
  --lead: #2443A0; --lead-deep: #172E73; --on-lead: #FFF3D6;
  --hi: #F6B826; --on-hi: #1B2D5C;
  --coral: #E95A3F; --sun: #F6B826; --pool: #3194D6; --leaf: #5C9E57; --sea: #2FA89A; --stone: #A9987A;
  --pos: #1C5FA8; --neg: #B23B24; --stamp: #E95A3F; --ticket: #D9E3F5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #1A1312; --paper: #241B1A; --paper-2: #2F2423; --receipt: #3A2D2B;
    --ink: #FCEBDD; --ink-2: #CDB7A9; --line: #4D3C39;
    --lead: #FF7A61; --lead-deep: #C4513C; --on-lead: #2A1512;
    --hi: #FFCC52; --on-hi: #2A1512;
    --coral: #FF7A61; --sun: #FFCC52; --pool: #5EC2EC; --leaf: #86C784; --sea: #5AD1C1; --stone: #9C8A80;
    --pos: #7FD3F5; --neg: #FF9A85; --stamp: #FF7A61; --ticket: #4A3826;
  }
  :root:not([data-theme="light"])[data-variant="piscina"] {
    --desk: #071A23; --paper: #0B2430; --paper-2: #0F2E3C; --receipt: #143A4B;
    --ink: #E4F3F7; --ink-2: #A3C4CF; --line: #22495A;
    --lead: #4EC6F2; --lead-deep: #2C93BB; --on-lead: #052230;
    --hi: #FFD84F; --on-hi: #0B2430;
    --coral: #FF8A76; --sun: #FFD84F; --pool: #4EC6F2; --leaf: #6CCB91; --sea: #4FD6C4; --stone: #7D99A3;
    --pos: #8EDCF8; --neg: #FFA192; --stamp: #4EC6F2; --ticket: #1F4D61;
  }
  :root:not([data-theme="light"])[data-variant="saluti"] {
    --desk: #0D1322; --paper: #131A2E; --paper-2: #192239; --receipt: #202B47;
    --ink: #F8EBCF; --ink-2: #C3BBA6; --line: #2E3A5A;
    --lead: #FFC534; --lead-deep: #C9961C; --on-lead: #131A2E;
    --hi: #FFC534; --on-hi: #131A2E;
    --coral: #FF7D63; --sun: #FFC534; --pool: #6DB7EE; --leaf: #8BC77F; --sea: #55CDBE; --stone: #8890A6;
    --pos: #93C8F5; --neg: #FF9C87; --stamp: #FF7D63; --ticket: #2C3B66;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #1A1312; --paper: #241B1A; --paper-2: #2F2423; --receipt: #3A2D2B;
  --ink: #FCEBDD; --ink-2: #CDB7A9; --line: #4D3C39;
  --lead: #FF7A61; --lead-deep: #C4513C; --on-lead: #2A1512;
  --hi: #FFCC52; --on-hi: #2A1512;
  --coral: #FF7A61; --sun: #FFCC52; --pool: #5EC2EC; --leaf: #86C784; --sea: #5AD1C1; --stone: #9C8A80;
  --pos: #7FD3F5; --neg: #FF9A85; --stamp: #FF7A61; --ticket: #4A3826;
}
:root[data-theme="dark"][data-variant="piscina"] {
  --desk: #071A23; --paper: #0B2430; --paper-2: #0F2E3C; --receipt: #143A4B;
  --ink: #E4F3F7; --ink-2: #A3C4CF; --line: #22495A;
  --lead: #4EC6F2; --lead-deep: #2C93BB; --on-lead: #052230;
  --hi: #FFD84F; --on-hi: #0B2430;
  --coral: #FF8A76; --sun: #FFD84F; --pool: #4EC6F2; --leaf: #6CCB91; --sea: #4FD6C4; --stone: #7D99A3;
  --pos: #8EDCF8; --neg: #FFA192; --stamp: #4EC6F2; --ticket: #1F4D61;
}
:root[data-theme="dark"][data-variant="saluti"] {
  --desk: #0D1322; --paper: #131A2E; --paper-2: #192239; --receipt: #202B47;
  --ink: #F8EBCF; --ink-2: #C3BBA6; --line: #2E3A5A;
  --lead: #FFC534; --lead-deep: #C9961C; --on-lead: #131A2E;
  --hi: #FFC534; --on-hi: #131A2E;
  --coral: #FF7D63; --sun: #FFC534; --pool: #6DB7EE; --leaf: #8BC77F; --sea: #55CDBE; --stone: #8890A6;
  --pos: #93C8F5; --neg: #FF9C87; --stamp: #FF7D63; --ticket: #2C3B66;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font-family: var(--f-text); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.display {
  font-family: var(--f-display); font-weight: var(--d-wght); letter-spacing: var(--d-track);
  font-variation-settings: var(--d-opsz); line-height: 1.05; text-wrap: balance;
}
.icon { width: 1.25em; height: 1.25em; flex: none; fill: currentColor; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* ---------- stage: desk + controls + device (from the flows prototype) ---------- */
.stage {
  min-height: 100%; display: grid; grid-template-columns: minmax(0, 290px) 390px;
  justify-content: center; align-items: start; gap: 48px; padding: 24px 16px;
}
.device {
  position: relative; width: 390px; height: min(844px, calc(100dvh - 48px));
  border-radius: 44px; overflow: hidden; background: var(--paper);
  outline: 1.5px solid var(--line); isolation: isolate;
}
.proto { position: sticky; top: 24px; font-size: 14px; color: var(--ink); }
.proto summary { list-style: none; cursor: pointer; }
.proto summary::-webkit-details-marker { display: none; }
.proto-head { display: flex; align-items: center; gap: 10px; }
@media (min-width: 761px) { .proto-head .small { display: none; } .proto summary { cursor: default; } }
.proto-head b { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.proto-body { display: grid; gap: 22px; margin-top: 14px; }
.proto p { margin: 0; color: var(--ink-2); }
.proto h2 { font-size: 13px; font-weight: 700; margin: 0 0 8px; color: var(--ink-2); }
.vlist { display: grid; gap: 8px; }
.vopt {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
  padding: 10px 12px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper);
}
.vopt[aria-pressed="true"] { border-color: var(--ink); }
.vopt .sw { grid-row: span 2; display: flex; }
.vopt .sw i { width: 14px; height: 28px; display: block; }
.vopt .sw i:first-child { border-radius: 8px 0 0 8px; } .vopt .sw i:last-child { border-radius: 0 8px 8px 0; }
.vopt b { font-size: 15px; }
.vopt small { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.seg { display: flex; padding: 3px; gap: 3px; border-radius: 999px; background: var(--paper-2); }
.seg button { flex: 1; padding: 7px 10px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); text-align: center; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--receipt); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump button { padding: 6px 11px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; background: var(--paper); }
.jump button:hover { border-color: var(--ink-2); }
.tokens { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 10px; font-size: 12px; }
.tokens span { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tokens i { width: 14px; height: 14px; border-radius: 50%; flex: none; outline: 1px solid var(--line); }
.tokens code { font-family: inherit; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fontline { font-size: 12.5px; color: var(--ink-2); }

@media (max-width: 760px) {
  .stage { display: flex; flex-direction: column; height: 100%; padding: 0; gap: 0; }
  .device { width: 100%; flex: 1; height: auto; min-height: 0; border-radius: 0; outline: 0; }
  .proto { position: relative; top: 0; z-index: 30; background: var(--desk); padding: 8px 16px; border-bottom: 1.5px solid var(--line); }
  .proto[open] .proto-body { position: absolute; left: 0; right: 0; top: 100%; padding: 16px; max-height: 75dvh; overflow: auto; background: var(--desk); border-bottom: 1.5px solid var(--line); margin: 0; }
  .proto-head b { font-size: 17px; }
}
/* ---------- app shell ---------- */
#app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; }
.pad { padding: 20px 16px 28px; }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }
h1, h2, h3, p { margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 16px;
  background: var(--lead); color: var(--on-lead); box-shadow: 0 3px 0 var(--lead-deep);
  transition: transform .18s cubic-bezier(.3,.7,.4,1.4), box-shadow .18s; white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--lead-deep); }
.btn:disabled { opacity: .45; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.btn.danger { background: var(--neg); color: var(--receipt); box-shadow: none; }
.btn.sm { min-height: 38px; padding: 0 15px; font-size: 14px; }
.link { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: var(--ink-2); }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; color: var(--ink); flex: none; }
.iconbtn:hover { background: var(--paper-2); }
.iconbtn .icon { width: 22px; height: 22px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scrollx { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; padding-bottom: 4px; scrollbar-width: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--receipt);
  font-weight: 600; font-size: 15px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--receipt); }
.chip .emo { font-size: 17px; line-height: 1; }

/* ---------- brand: the "=" mark ---------- */
.eq { --w: 34px; --h: 7px; display: inline-grid; gap: calc(var(--h) * .9); width: var(--w); flex: none; }
.eq i { display: block; height: var(--h); border-radius: 999px; transition: transform .5s cubic-bezier(.3,.8,.3,1.3); }
.eq i:first-child { background: var(--hi); }
.eq i:last-child { background: var(--lead); }
.eq.open i:first-child { transform: translateX(30%) rotate(-9deg); }
.eq.open i:last-child { transform: translateX(-22%) rotate(7deg); }
.eq.mono i { background: currentColor; }
.wordmark { display: flex; align-items: center; gap: 12px; }
.wordmark .display { font-size: calc(30px * var(--d-scale)); }
/* ---------- receipts: the signature object ---------- */
.zz {
  --zz: 9px; background: var(--receipt); position: relative;
  -webkit-mask:
    conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(var(--zz) * 2) 51% repeat-x,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) 51% repeat-x;
          mask:
    conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(var(--zz) * 2) 51% repeat-x,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) 51% repeat-x;
}
.zz-b {
  --zz: 10px; background: var(--receipt);
  -webkit-mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - var(--zz)) no-repeat,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) var(--zz) repeat-x;
          mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - var(--zz)) no-repeat,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--zz) * 2) var(--zz) repeat-x;
}
.edge { filter: drop-shadow(0 1.5px 0 var(--line)); }
.tear { border: 0; border-top: 2px dashed var(--line); margin: 0; }

.cat-dot {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--cat, var(--stone)) 32%, var(--receipt)); font-size: 21px; line-height: 1;
}
/* ---------- trip chrome ---------- */
.tripbar { display: flex; align-items: center; gap: 4px; padding: 10px 8px 8px 4px; background: var(--paper); }
.tripbar h1 { font-size: calc(23px * var(--d-scale)); }
.tripbar p { font-size: 13.5px; color: var(--ink-2); }
.me-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--paper-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
.me-chip .icon { width: 16px; height: 16px; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); padding: 0 16px 6px; }
.sync .icon { width: 16px; height: 16px; }
.closedbar { display: flex; align-items: center; gap: 10px; margin: 0 16px 8px; padding: 10px 14px; border-radius: 14px; background: var(--paper-2); font-size: 14px; }

.tabbar {
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--paper); border-top: 1.5px solid var(--line);
}
.tabbar button { display: grid; justify-items: center; gap: 2px; padding: 4px 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tabbar .pill { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background .2s; }
.tabbar .icon { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] .pill { background: var(--hi); color: var(--on-hi); }
.fab {
  position: absolute; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
  background: var(--lead); color: var(--on-lead); box-shadow: 0 4px 0 var(--lead-deep);
  transition: transform .2s cubic-bezier(.3,.7,.4,1.5);
}
.fab .icon { width: 28px; height: 28px; }
.fab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lead-deep); }
.amt-pos { color: var(--pos); font-weight: 700; }
.amt-neg { color: var(--neg); font-weight: 700; }
.amt-zero { color: var(--ink-2); font-weight: 700; }
/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--paper); }
.overlay.push-in { animation: push .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes push { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
.scrim { position: absolute; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 38%, transparent); display: flex; flex-direction: column; justify-content: flex-end; }
.scrim.fade-in { animation: fade .25s ease-out both; }
@keyframes fade { from { opacity: 0; } }
.check { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--ink-2); }
.check[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--receipt); }
.check .icon { width: 18px; height: 18px; }
.check[aria-pressed="false"] .icon { visibility: hidden; }
.toast {
  position: absolute; left: 16px; right: 16px; bottom: calc(164px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px;
  background: var(--ink); color: var(--paper); font-weight: 600; font-size: 15px;
  animation: toast .35s cubic-bezier(.25,1.3,.45,1) both;
}
.toast button { margin-left: auto; color: var(--hi); font-weight: 700; }
@keyframes toast { from { transform: translateY(16px); opacity: 0; } }
.rc:focus-visible, .tk:focus-visible, .trip-tk:focus-visible { outline-offset: -5px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: color-mix(in srgb, var(--av) 40%, var(--receipt)); color: var(--ink); flex: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}

/* ================= Grafici prototype additions ================= */
/* Variant "Scelta": the author's pick from the flows prototype. Ombrellone's palette (inherited from :root, light and dark) with Piscina's fonts and display tuning. */
:root[data-variant="scelta"] {
  --f-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-text: "Onest", "Segoe UI", "Helvetica Neue", sans-serif;
  --d-wght: 400; --d-track: 0; --d-scale: .94; --d-opsz: normal;
}
/* chart-only tokens, derived from the variant tokens so every variant and theme follows */
:root {
  --tx: color-mix(in srgb, var(--ink) 52%, transparent);
  --future: color-mix(in srgb, var(--ink) 5%, transparent);
  --grid: var(--line);
}
.proto { max-height: calc(100dvh - 48px); overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
.jump button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--receipt); }
.proto .lib { display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); }
.proto .lib b { color: var(--ink); }
.proto table { width: 100%; border-collapse: collapse; font-size: 12px; }
.proto td, .proto th { text-align: left; padding: 3px 4px 3px 0; vertical-align: top; }
.proto th { color: var(--ink-2); font-weight: 600; }
.proto tbody tr + tr td { border-top: 1px solid var(--line); }
.proto .range { width: 100%; accent-color: var(--lead); }
.proto .daylabel { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.switch .check { width: 26px; height: 26px; border-radius: 8px; }
.device.wide { width: 760px; border-radius: 28px; }
@media (min-width: 761px) { .stage:has(.device.wide) { grid-template-columns: minmax(0, 290px) 760px; } }
@media (max-width: 760px) { .device.wide { width: 100%; border-radius: 0; } .proto { max-height: none; } .only-desk { display: none !important; } }

#app { container-type: inline-size; }
.feed { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; padding: 4px 16px 28px; }
@container (min-width: 620px) {
  .feed { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding-inline: 24px; }
  .span2 { grid-column: 1 / -1; }
}
.filters { padding: 6px 16px 10px; }
.filters .chips.scrollx { margin-inline: -16px; padding-inline: 16px; }
.chip .avatar { width: 26px; height: 26px; font-size: 12px; margin-left: -8px; }
.chip[aria-pressed="true"] .avatar { background: var(--receipt); color: var(--ink); }
.filters .scope { font-size: 13px; color: var(--ink-2); margin-top: 6px; }

.card { display: grid; gap: 14px; padding: 22px 16px 24px; grid-template-columns: minmax(0, 1fr); }
.ch-head { display: flex; align-items: flex-start; gap: 10px; }
.ch-head h2 { font-size: calc(21px * var(--d-scale)); }
.ch-sub { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
.mini-btn { flex: none; min-height: 34px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink); }
.mini-btn:hover { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.mini-btn[aria-pressed="true"] { background: var(--ink); color: var(--receipt); box-shadow: none; }
.seg.small { padding: 2px; }
.seg.small button { padding: 5px 10px; font-size: 13px; }

.hero-fig { display: grid; gap: 4px; }
.hero-fig small { font-size: 13.5px; color: var(--ink-2); }
.hero-fig .display { font-size: calc(40px * var(--d-scale)); line-height: 1.05; }
.hero-fig p { font-size: 14.5px; color: var(--ink-2); max-width: 40ch; }
.hero-fig p b { color: var(--ink); }
.stats { display: grid; grid-template-columns: 1fr 1fr; padding-top: 14px; border-top: 2px dashed var(--line); }
.stats > div + div { border-left: 2px dashed var(--line); padding-left: 14px; }
.stats b { display: block; font-size: 18px; font-weight: 700; }
.stats small { display: block; font-size: 13px; color: var(--ink-2); }
.stats.one { grid-template-columns: 1fr; }

.chart { position: relative; min-height: 40px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; -webkit-user-select: none; user-select: none; }
.chart svg text { font-family: var(--f-text); fill: var(--ink-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chart svg text.strong { fill: var(--ink); font-weight: 700; font-size: 12.5px; }
.chart svg text.today { fill: var(--ink); font-weight: 700; }
.chart svg text.dim { opacity: .55; }
.chart svg .gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart svg .base { stroke: var(--ink-2); stroke-width: 1; shape-rendering: crispEdges; }
.chart svg .hit { fill: transparent; cursor: pointer; outline: none; }
.chart svg .hit:focus-visible { fill: color-mix(in srgb, var(--ink) 7%, transparent); }
.chart svg .xh line { stroke: var(--ink); stroke-width: 1; }
.chart svg .xh { pointer-events: none; }
.chart svg .lbl-bg { fill: var(--receipt); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-weight: 600; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; background-color: var(--c); }
.key-line { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--lead); }
.key-dash { display: inline-block; width: 18px; height: 0; border-top: 2.5px dashed var(--lead); opacity: .8; }
.note { font-size: 13px; color: var(--ink-2); }

/* textures: the backup channel for colour (opt-in, plus always on custom categories) */
.tx-a { background-image: repeating-linear-gradient(45deg, var(--tx) 0 1.6px, transparent 1.6px 6px); }
.tx-b { background-image: repeating-linear-gradient(135deg, var(--tx) 0 1.6px, transparent 1.6px 6px); }
.tx-c { background-image: repeating-linear-gradient(45deg, var(--tx) 0 1.4px, transparent 1.4px 3.6px); }
.tx-d { background-image: radial-gradient(var(--tx) 1.2px, transparent 1.4px); background-size: 5px 5px; }
.tx-e { background-image: repeating-linear-gradient(135deg, var(--tx) 0 1.4px, transparent 1.4px 3.6px); }
.tx-x { background-image: repeating-linear-gradient(45deg, var(--tx) 0 1.3px, transparent 1.3px 6px), repeating-linear-gradient(135deg, var(--tx) 0 1.3px, transparent 1.3px 6px); }

/* category bars (chart 1) */
.cats { display: grid; gap: 4px; }
.catrow { display: grid; gap: 7px; padding: 8px 0; width: 100%; text-align: left; border-radius: 10px; }
.catrow:focus-visible { outline-offset: 2px; }
.catrow .top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 15px; }
.catrow .top .emo { font-size: 16px; }
.catrow .top b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .top .num { font-weight: 700; }
.catrow .top .pct { font-size: 13px; color: var(--ink-2); font-weight: 500; margin-left: 6px; }
.hbar { height: 12px; border-radius: 0 4px 4px 0; background-color: var(--c); min-width: 2px; }
.catrow[aria-expanded="true"] .hbar, .catrow:hover .hbar { filter: brightness(1.06) saturate(1.05); }

/* ranking (chart 7): a long receipt */
.rank { display: grid; }
.rk { display: grid; grid-template-columns: 26px 40px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; width: 100%; text-align: left; }
.rk + .rk { border-top: 2px dotted var(--line); }
.rk .pos { font-family: var(--f-display); font-weight: var(--d-wght); font-variation-settings: var(--d-opsz); font-size: calc(20px * var(--d-scale)); color: var(--ink-2); text-align: center; }
.rk .cat-dot { width: 40px; height: 40px; font-size: 19px; }
.rk .d { font-weight: 700; font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.rk .m { font-size: 13px; color: var(--ink-2); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rk .a { text-align: right; font-weight: 700; font-size: 15.5px; }
.rk .a small { display: block; font-weight: 500; font-size: 12.5px; color: var(--ink-2); }
.rk .hbar { grid-column: 3 / -1; height: 6px; }

/* paid vs due (chart 3) */
.pvd { display: grid; gap: 6px; }
.pr { display: grid; gap: 8px; padding: 10px 0; width: 100%; text-align: left; transition: opacity .25s; }
.pr + .pr { border-top: 1.5px solid var(--line); }
.pr .top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.pr .top b { font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .avatar { width: 32px; height: 32px; font-size: 13px; }
.pr .words { font-size: 13.5px; color: var(--ink-2); }
.pr.dim { opacity: .38; }
.track { position: relative; height: 22px; }
.track > i { position: absolute; top: 5px; height: 12px; display: block; }
.track .paid { left: 0; background: var(--ink); border-radius: 0 4px 4px 0; }
.track .over { background: var(--pos); border-radius: 0 4px 4px 0; }
.track .short { background-color: color-mix(in srgb, var(--neg) 22%, transparent); background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--neg) 70%, transparent) 0 1.5px, transparent 1.5px 5px); border-radius: 0 4px 4px 0; }
.track .due { top: 0; height: 22px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 2px var(--receipt); }
.pvd-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.pvd-key span { display: inline-flex; align-items: center; gap: 6px; }
.pvd-key i { display: inline-block; }
.k-paid { width: 16px; height: 10px; background: var(--ink); border-radius: 0 3px 3px 0; }
.k-due { width: 3px; height: 16px; background: var(--ink); border-radius: 2px; }
.k-over { width: 16px; height: 10px; background: var(--pos); border-radius: 0 3px 3px 0; }
.k-short { width: 16px; height: 10px; border-radius: 0 3px 3px 0; background-color: color-mix(in srgb, var(--neg) 22%, transparent); background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--neg) 70%, transparent) 0 1.5px, transparent 1.5px 5px); }

/* postcards: the charts one tap away */
.postcard {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 14px; align-items: center;
  width: 100%; padding: 18px 16px 18px 18px; text-align: left; border-radius: 16px;
  background: var(--receipt); box-shadow: inset 0 0 0 1.5px var(--line);
  transition: transform .18s cubic-bezier(.3,.7,.4,1.4);
}
.postcard:active { transform: translateY(1px) rotate(-.3deg); }
.postcard::after { content: ""; position: absolute; top: 14px; bottom: 14px; right: 112px; border-left: 1.5px dashed var(--line); }
.postcard h3 { font-size: calc(19px * var(--d-scale)); }
.postcard p { font-size: 14px; color: var(--ink-2); margin-top: 6px; padding-right: 18px; }
.postcard .go { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-weight: 700; font-size: 14px; color: var(--ink); }
.postcard .go .icon { width: 16px; height: 16px; }
.stamp-mini {
  --r: 4px; width: 84px; height: 100px; padding: 9px; background: var(--paper-2); display: grid; place-items: center;
  -webkit-mask: radial-gradient(circle var(--r) at var(--r) var(--r), #0000 97%, #000) calc(-1 * var(--r)) calc(-1 * var(--r)) / calc(var(--r) * 3) calc(var(--r) * 3) round;
          mask: radial-gradient(circle var(--r) at var(--r) var(--r), #0000 97%, #000) calc(-1 * var(--r)) calc(-1 * var(--r)) / calc(var(--r) * 3) calc(var(--r) * 3) round;
  transform: rotate(3deg);
}
.stamp-mini svg { width: 100%; height: 100%; display: block; }

/* person x category heat table (chart 5) */
.heat-wrap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
.heat { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; font-variant-numeric: tabular-nums; }
.heat th { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 0 1px 4px; line-height: 1.2; vertical-align: bottom; text-align: center; hyphens: none; }
.heat th.rowh { text-align: left; width: 104px; font-size: 13.5px; color: var(--ink); vertical-align: middle; padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heat th.hl { color: var(--ink); }
.heat th.hl span { box-shadow: inset 0 -3px 0 var(--hi); }
.heat td { padding: 0; }
.heat td button { width: 100%; height: 40px; text-align: center; border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--h); color: var(--ink); }
.heat td button.inv { color: var(--on-lead); }
.heat td button.zero { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-2); font-weight: 500; }
.heat td.hl button { box-shadow: 0 0 0 2px var(--ink); }
.heat tfoot td { font-size: 13px; font-weight: 700; text-align: center; padding-top: 6px; border-top: 2px dashed var(--line); }
.heat tfoot th { padding-top: 6px; border-top: 2px dashed var(--line); }
.ramp { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.ramp i { flex: 1; max-width: 160px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--lead) 8%, var(--receipt)), color-mix(in srgb, var(--lead) 92%, var(--receipt))); box-shadow: inset 0 0 0 1px var(--line); }

/* number tables (every chart's table twin) */
.nt { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.nt th { text-align: left; font-size: 12.5px; color: var(--ink-2); font-weight: 600; padding: 0 6px 6px 0; }
.nt td { padding: 7px 6px 7px 0; border-top: 1.5px solid var(--line); }
.nt .r { text-align: right; padding-right: 0; }
.nt .est td { color: var(--ink-2); font-style: italic; }

/* overlay header */
.ov-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 6px 4px; }
.ov-head h1 { font-size: calc(22px * var(--d-scale)); flex: 1; min-width: 0; }
.ov-body { padding: 6px 16px 28px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.ov-lede { font-size: 15px; }
.ov-lede b { font-weight: 700; }

/* tooltip: one floating mini receipt, works with touch, focus and pointer */
.tip {
  position: absolute; z-index: 25; max-width: 250px; min-width: 150px; padding: 10px 12px 11px; border-radius: 14px;
  background: var(--ink); color: var(--paper); pointer-events: none; font-size: 13px; line-height: 1.35;
  box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--ink) 60%, transparent);
}
.tip .tt { opacity: .78; font-size: 12.5px; }
.tip .tv { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
.tip .tr { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: 3px; font-variant-numeric: tabular-nums; }
.tip .tr i { height: 3px; border-radius: 2px; background: var(--c); }
.tip .tr b { font-weight: 700; }
.tip .tr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
.tip .tn { margin-top: 5px; opacity: .78; font-size: 12.5px; }
.tip.show { animation: tipin .16s cubic-bezier(.2,.8,.2,1) both; }
@keyframes tipin { from { opacity: 0; transform: translateY(4px); } }

/* meaningful motion: marks grow from the baseline when the numbers change (filter, day, mode); the line draws once */
@media (prefers-reduced-motion: no-preference) {
  .grow .gx { animation: gx .55s cubic-bezier(.2,.8,.2,1) both; transform-origin: left center; }
  .grow .gy { animation: gy .55s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; }
  .grow .draw { stroke-dasharray: 1 1; animation: draw .9s cubic-bezier(.4,0,.2,1) both; }
  .grow .later { animation: fade .35s ease-out .75s both; }
}
@keyframes gx { from { transform: scaleX(0); } }
@keyframes gy { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@media (forced-colors: active) { .hbar, .sw, .track > i { forced-color-adjust: none; } }
</style>
</head>

function alloc(total, ids, w) {
  const sg = total < 0 ? -1 : 1, A = Math.abs(total), W = w.reduce((a, b) => a + b, 0);
  if (!W) return { shares: {}, extra: [] };
  const rows = ids.map((id, i) => ({ id, i, w: w[i], fl: Math.floor((A * w[i]) / W), r: (A * w[i]) % W }));
  const rem = A - rows.reduce((a, x) => a + x.fl, 0);
  const order = rows.filter(x => x.w > 0).sort((a, b) => b.r - a.r || a.i - b.i);
  const extra = [];
  for (let k = 0; k < rem; k++) { order[k].fl++; extra.push(order[k].id); }
  const shares = {};
  rows.forEach(x => { if (x.w > 0) shares[x.id] = sg * x.fl; });
  return { shares, extra };
}
function sharesOf(tr, e) {

  return alloc(e.amount, ids, w);
}

/* ================= model: everything the charts show, folded from the operations ================= */
function model() {
  const tr = trip(), who = S.who;
  const days = []; for (let d = tr.from; d <= tr.to; d = addDays(d, 1)) days.push(d);
  const D = days.length, N = clamp(S.day, 1, D), today = days[N - 1];
  const exps = liveExps(tr).filter(e => e.date <= today);
  const sets = liveSets(tr).filter(s => s.date <= today);
  const shareMemo = new Map();
  const share = e => { if (!shareMemo.has(e.id)) shareMemo.set(e.id, sharesOf(tr, e).shares); return shareMemo.get(e.id); };
  const amt = e => (who ? share(e)[who] || 0 : e.amount);
  const headsOf = id => (tr.dsplit.m === "shares" ? tr.dsplit.w[id] || 1 : 1);
  const headsAll = tr.dsplit.m === "shares" ? sum(Object.values(tr.dsplit.w)) : tr.people.length;
  const heads = who ? headsOf(who) : headsAll;
  const cats = catsInOrder(tr);
  const daily = days.map(() => Object.fromEntries(cats.map(c => [c, 0])));
  exps.forEach(e => { const c = cats.includes(e.cat) ? e.cat : "altro"; daily[days.indexOf(e.date)][c] += amt(e); });
  const dayTot = daily.map(o => sum(Object.values(o)));
  const cum = []; dayTot.reduce((a, v, i) => (cum[i] = a + v), 0);
  const total = cum[N - 1];
  const byCat = cats.map(id => {
    const list = exps.filter(e => e.cat === id && amt(e) !== 0);
    const top = list.filter(e => amt(e) > 0).sort((a, b) => amt(b) - amt(a))[0];
    return { id, v: sum(list.map(amt)), n: list.filter(e => amt(e) > 0).length, refunds: sum(list.filter(e => amt(e) < 0).map(amt)), top };
  });
  let pace = null, proj = null;
  if (N < D) {
    const lodge = sum(daily.slice(0, N).map(o => o.alloggio));
    pace = S.pace === "all" ? total / N : S.pace === "last3" ? sum(dayTot.slice(Math.max(0, N - 3), N)) / Math.min(3, N) : (total - lodge) / N;
    proj = total + pace * (D - N);
  }
  const paid = {}, due = {};
  tr.people.forEach(p => { paid[p.id] = 0; due[p.id] = 0; });
  exps.forEach(e => { e.payers.forEach(([id, c]) => (paid[id] += c)); const s = share(e); for (const id in s) due[id] += s[id]; });
  return { tr, who, days, D, N, today, exps, sets, share, amt, heads, headsAll, headsOf, cats, daily, dayTot, cum, total, byCat, pace, proj, paid, due };
}
// Running balance per person after every expense and settlement: who carried the group, and when.
function bankModel(M) {
  const tr = M.tr, ids = tr.people.map(p => p.id);
  const ev = [...M.exps.map(e => ({ at: e.at, e })), ...M.sets.map(s => ({ at: s.at, s }))].sort((a, b) => (a.at < b.at ? -1 : 1));
  const b = Object.fromEntries(ids.map(id => [id, 0]));
  const t0 = new Date(M.days[0] + "T00:00:00").getTime(), t1 = new Date(addDays(M.days[M.D - 1], 1) + "T00:00:00").getTime(), tNow = new Date(addDays(M.today, 1) + "T00:00:00").getTime();
  const steps = [{ t: t0, b: { ...b }, ev: null }];
  for (const x of ev) {
    if (x.e) { x.e.payers.forEach(([id, c]) => (b[id] += c)); const s = M.share(x.e); for (const id in s) b[id] -= s[id]; }
    else { b[x.s.from] += x.s.c; b[x.s.to] -= x.s.c; }
    steps.push({ t: new Date(x.at).getTime(), b: { ...b }, ev: x });
  }
  const held = Object.fromEntries(ids.map(id => [id, 0]));
  let peak = { v: 0, id: null, t: t0 };
  steps.forEach((st, i) => {
    const end = i + 1 < steps.length ? steps[i + 1].t : tNow;
    const top = ids.filter(id => st.b[id] > 0).sort((x, y) => st.b[y] - st.b[x])[0];
    if (top) held[top] += end - st.t;
    ids.forEach(id => { if (st.b[id] > peak.v) peak = { v: st.b[id], id, t: st.t }; });
  });
  const bankId = ids.slice().sort((x, y) => held[y] - held[x])[0];
  const bankDays = Math.round(held[bankId] / 864e5);
  let lo = 0, hi = 0;
  steps.forEach(st => ids.forEach(id => { lo = Math.min(lo, st.b[id]); hi = Math.max(hi, st.b[id]); }));
  return { ids, steps, t0, t1, tNow, peak, bankId: held[bankId] > 0 ? bankId : null, bankDays, lo, hi };
}

/* ================= chart primitives (hand-written SVG) ================= */
let TIPS = {}, SCRUB = {};
const GUT = 46; // left gutter for y-axis labels, so they never sit on the marks
const niceStep = (max, n = 4) => { const raw = Math.max(max, 1) / n, mag = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw); };
const svgOpen = (W, H, label) => `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">`;
const txt = (x, y, s, cls = "", anchor = "start") => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="${cls}">${esc(s)}</text>`;
const labelPill = (x, y, s, anchor = "end") => { const w = s.length * 6.6 + 10; const x0 = anchor === "end" ? x - w : anchor === "middle" ? x - w / 2 : x; return `<rect class="lbl-bg" x="${x0.toFixed(1)}" y="${(y - 12).toFixed(1)}" width="${w.toFixed(1)}" height="17" rx="8.5"/>${txt(x0 + w / 2, y + 0.5, s, "strong", "middle")}`; };
const dayAxis = (M, xc, y, todayIdx) => M.days.map((d, i) => txt(xc(i), y, dWk(d), i >= M.N ? "dim" : "", "middle") + txt(xc(i), y + 14, dNum(d), i === todayIdx ? "today" : i >= M.N ? "dim" : "", "middle")).join("");
const segRect = (x, y, w, h, c, extra = "") => {
  if (h <= 0) return "";
  const tx = txOf(c);
  return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="fill:var(--${c.color})" ${extra}/>` + (tx ? `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="url(#tx-${tx})"/>` : "");
};
const PATTERNS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="tx-a" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="6" style="fill:var(--tx)"/></pattern>
  <pattern id="tx-b" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect width="1.6" height="6" style="fill:var(--tx)"/></pattern>
  <pattern id="tx-c" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="3.6" style="fill:var(--tx)"/></pattern>
  <pattern id="tx-e" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect width="1.4" height="3.6" style="fill:var(--tx)"/></pattern>
  <pattern id="tx-d" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.2" style="fill:var(--tx)"/></pattern>
  <pattern id="tx-x" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.3" height="6" style="fill:var(--tx)"/><rect width="6" height="1.3" style="fill:var(--tx)"/></pattern>
</defs></svg>`;

/* ---- chart 4: running total, with pace and end-of-trip projection ---- */
function drawCum(M, W) {
  const H = 196, pt = 20, pb = 36, pl = GUT, pr = 2, pw = W - pl - pr, ph = H - pt - pb;
  const band = pw / M.D, xc = i => pl + (i + 0.5) * band;
  const projAt = i => M.total + M.pace * (i - (M.N - 1));
  const top = Math.max(M.proj || 0, ...M.cum, 1), step = niceStep(top, 3), ymax = Math.ceil(top / step) * step;
  const ymin = Math.min(0, ...M.cum.slice(0, M.N)), y = v => pt + ph * (1 - (v - ymin) / (ymax - ymin));
  let s = svgOpen(W, H, `${t("c_cum")}: ${fmt(M.total)}`);
  if (M.N < M.D) s += `<rect x="${pl + M.N * band}" y="${pt - 6}" width="${pw - M.N * band}" height="${ph + 6}" rx="8" style="fill:var(--future)"/>`;
  for (let v = step; v <= ymax; v += step) s += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>` + txt(pl - 6, y(v) + 4, fmt0(v), "", "end");
  s += txt(pl - 6, y(0) + 4, fmt0(0), "", "end");
  const pts = [[pl, y(0)], ...M.cum.slice(0, M.N).map((v, i) => [xc(i), y(v)])];
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("");
  s += `<path class="later" d="${line}L${xc(M.N - 1).toFixed(1)} ${y(0).toFixed(1)}Z" style="fill:color-mix(in srgb, var(--lead) 13%, transparent)"/>`;
  s += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>`;
  s += `<path class="draw" pathLength="1" d="${line}" fill="none" style="stroke:var(--lead)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const tx = xc(M.N - 1), ty = y(M.total);
  if (M.proj != null) {
    const ex = xc(M.D - 1), ey = y(M.proj);
    s += `<g class="later"><path d="M${tx.toFixed(1)} ${ty.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" style="stroke:var(--lead)" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round" opacity=".85"/>`;
    s += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4.5" style="fill:var(--receipt);stroke:var(--lead)" stroke-width="2.5"/>` + labelPill(W - pr, ey - 12, "≈ " + fmtAbout(M.proj)) + `</g>`;
  }
  s += `<circle class="later" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5.5" style="fill:var(--lead);stroke:var(--receipt)" stroke-width="2.5"/>`;
  const close = M.proj != null && M.D - M.N < 3;
  const lx = M.N === 1 ? tx + 10 : tx - 10, la = M.N === 1 ? "start" : "end";
  s += `<g class="later">${labelPill(close ? tx - 10 : lx, close ? ty + 22 : ty - 12, fmt0(M.total), close ? "end" : la)}</g>`;
  s += dayAxis(M, xc, H - 18, M.N - 1);
  s += `<g class="xh" style="display:none"><line y1="${pt - 6}" y2="${pt + ph}"/><circle r="5" style="fill:var(--ink);stroke:var(--receipt)" stroke-width="2"/></g>`;
  s += `<rect class="hit" data-scrub="cum" tabindex="0" role="slider" aria-label="${esc(t("c_cum"))}" aria-valuetext="${esc(fmt(M.total))}" x="${pl}" y="0" width="${pw}" height="${H}"/></svg>`;
  const maxI = M.proj != null ? M.D - 1 : M.N - 1;
  SCRUB.cum = {
    n: maxI + 1, start: M.N - 1, index: x => clamp(Math.floor((x - pl) / band), 0, maxI),
    at: i => ({ x: xc(i), y: y(i < M.N ? M.cum[i] : projAt(i)) }),
    tip: i => (i < M.N ? { t: t("untilDay", dDay(M.days[i])), v: fmt(M.cum[i]), n: t("thatDay", fmt(M.dayTot[i])) } : { t: t("estFor", dDay(M.days[i])), v: "≈ " + fmtAbout(projAt(i)), n: t("paceNote")[S.pace] }),
  };
  return s;
}

/* ---- chart 2 + 6: by day, stacked by category; "per person" divides by heads ---- */
function drawDays(M, W) {
  const head = S.dayMode === "head", div = head ? M.heads : 1;

  const cats = M.cats.map(id => catOf(M.tr, id));

  const neg = M.daily.map((o, i) => (i < M.N ? sum(cats.map(c => Math.min(0, o[c.id]))) / div : 0));
  const step = niceStep(Math.max(...pos, 1), 3), ymax = Math.ceil(Math.max(...pos, 1) / step) * step;

    negSegs.forEach((c, k) => { const v = o[c.id] / div, a = y(n), b = y(n + v); n += v; down += segRect(x, a + (k > 0 ? 1 : 0), bw, b - a - (k > 0 ? 1 : 0) - (k < negSegs.length - 1 ? 1 : 0), c); });

  });

  }
  s += dayAxis(M, xc, H - 18, M.N - 1);
  M.daily.forEach((o, i) => {

    TIPS[key] = { ay: y(pos[i]), t: dDay(M.days[i]), v: fmt(M.dayTot[i] / div) + (head ? " " + (S.lang === "it" ? "a testa" : "each") : ""),
      rows: cats.filter(c => o[c.id] !== 0).map(c => ({ c: c.color, l: `${c.emoji} ${c.name}`, v: fmt(o[c.id] / div) })) };
    s += `<rect class="hit" data-tip="${key}" tabindex="0" role="button" aria-label="${esc(dDay(M.days[i]) + ": " + fmt(M.dayTot[i] / div))}" x="${(pl + i * band).toFixed(1)}" y="0" width="${band.toFixed(1)}" height="${H}"/>`;
