  rows.forEach((id, r) => {
    const top = r * rowH + lab, yv = v => top + (ph * (hi - v)) / (hi - lo), y0 = yv(0);
    let d = `M${x(BM.t0).toFixed(1)} ${y0.toFixed(1)}`;
    BM.steps.forEach((st, k) => { if (k) d += `H${x(st.t).toFixed(1)}`; d += `V${yv(st.b[id]).toFixed(1)}`; });
    d += `H${x(BM.tNow).toFixed(1)}`;
    const area = `${d}V${y0.toFixed(1)}Z`;
    defs += `<clipPath id="bu${r}"><rect x="0" y="${top - 2}" width="${W}" height="${(y0 - top + 2).toFixed(1)}"/></clipPath><clipPath id="bd${r}"><rect x="0" y="${y0.toFixed(1)}" width="${W}" height="${(top + ph - y0 + 2).toFixed(1)}"/></clipPath>`;
    const last = BM.steps[BM.steps.length - 1].b[id];
    const dim = M.who && M.who !== id ? ` opacity=".35"` : "";
    s += `<g${dim}>` + txt(pl, top - 8, nm(id), "strong") + txt(W - pr, top - 8, fmtS(last), "strong", "end");
    s += `<g class="later"><path d="${area}" clip-path="url(#bu${r})" style="fill:color-mix(in srgb, var(--pos) 20%, transparent)"/><path d="${area}" clip-path="url(#bd${r})" style="fill:color-mix(in srgb, var(--neg) 18%, transparent)"/></g>`;
    s += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" opacity=".6"/>`;
    s += `<g class="draw-wrap"><path d="${d}" clip-path="url(#bu${r})" fill="none" style="stroke:var(--pos)" stroke-width="2" stroke-linejoin="round"/><path d="${d}" clip-path="url(#bd${r})" fill="none" style="stroke:var(--neg)" stroke-width="2" stroke-linejoin="round"/></g>`;
    BM.steps.forEach(st => { if (st.ev && st.ev.s && (st.ev.s.from === id || st.ev.s.to === id)) s += `<circle cx="${x(st.t).toFixed(1)}" cy="${yv(st.b[id]).toFixed(1)}" r="4" style="fill:var(--ink);stroke:var(--receipt)" stroke-width="2"/>`; });
    s += `</g>`;
  });
  s = s.replace("</title-slot>", `<defs>${defs}</defs>`);
  const xc = i => x(BM.t0 + (i + 0.5) * 864e5);
  s += dayAxis(M, xc, H - 18, M.N - 1);
  s += `<g class="xh" style="display:none"><line y1="0" y2="${rows.length * rowH - 8}"/></g>`;
  s += `<rect class="hit" data-scrub="bank" tabindex="0" role="slider" aria-label="${esc(t("c_bank"))}" x="${pl}" y="0" width="${pw}" height="${H}"/></svg>`;
  const pts = BM.steps.map(st => x(st.t));
  SCRUB.bank = {
    n: pts.length, start: pts.length - 1, index: px => { let best = 0; pts.forEach((p, k) => { if (Math.abs(p - px) < Math.abs(pts[best] - px)) best = k; }); return best; },
    at: k => ({ x: pts[k], y: 4 }),
    tip: k => {
      const st = BM.steps[k], e = st.ev;
      const what = !e ? t("start") : e.e ? `${e.e.desc} (${fmt(e.e.amount)})` : `${t("settleL", nm(e.s.from), nm(e.s.to))} (${fmt(e.s.c)})`;
      return { t: e ? dTime(e.at) : dDay(M.days[0]), v: null, rows: BM.ids.map(id => ({ c: st.b[id] >= 0 ? "pos" : "neg", l: nm(id), v: fmtS(st.b[id]) })), n: e ? t("after", what) : what };
    },
  };
  return s;
}

/* ================= views ================= */
const sub = M => (M.who ? t("subWho", nm(M.who)) : t("subGroup", dRangeShort(M.days[0], M.today)));
const cardHead = (id, title, subline, extra = "") => `<div class="ch-head"><div class="grow"><h2 class="display">${esc(title)}</h2>${subline ? `<p class="ch-sub">${subline}</p>` : ""}</div>${extra}${id ? `<button class="mini-btn" data-act="table" data-v="${id}" aria-pressed="${!!S.tables[id]}">${S.tables[id] ? t("backChart") : t("numbers")}</button>` : ""}</div>`;
const ntable = (head, rows, estRows = []) => `<table class="nt"><thead><tr>${head.map((h, i) => `<th class="${i ? "r" : ""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r, k) => `<tr class="${estRows.includes(k) ? "est" : ""}">${r.map((c, i) => `<td class="${i ? "r num" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;

function vFilters() {
  const tr = trip();
  const chips = [`<button class="chip" data-act="who" data-v="" aria-pressed="${!S.who}">${t("group")}</button>`,
    ...tr.people.map(p => `<button class="chip" data-act="who" data-v="${p.id}" aria-pressed="${S.who === p.id}">${avatar(p.id)}${esc(p.name)}${p.id === tr.me ? ` <span style="font-weight:500">(${t("you")})</span>` : ""}</button>`)];
  return `<div class="filters"><div class="chips scrollx" role="group" aria-label="${t("filterL")}">${chips.join("")}</div><p class="scope">${esc(S.who ? t("scopeWho", nm(S.who)) : t("scopeGroup"))}</p></div>`;
}

function vHero(M) {
  const ended = M.N >= M.D;
  const title = M.who ? (ended ? t("partAll", nm(M.who)) : t("partSoFar", nm(M.who))) : ended ? t("spentAll") : t("spentSoFar");
  const line = M.proj != null ? T[S.lang].pace_s[S.pace](fmt(M.pace), fmtAbout(M.proj)) : esc(t("endedLine", M.N, dDay(M.days[M.dayTot.indexOf(Math.max(...M.dayTot))]), fmt(Math.max(...M.dayTot))));
  const body = S.tables.cum
    ? ntable([t("th_day"), t("th_that"), t("th_cum")], M.days.map((d, i) => (i < M.N ? [dDay(d), fmt(M.dayTot[i]), fmt(M.cum[i])] : [dDay(d), t("est"), M.proj != null ? "≈ " + fmtAbout(M.total + M.pace * (i - M.N + 1)) : "-"])), M.days.map((d, i) => (i >= M.N ? i : -1)))
    : `<div class="chart" data-chart="cum"></div>
       <div class="legend"><span><i class="key-line"></i>${S.lang === "it" ? "speso" : "spent"}</span>${M.proj != null ? `<span><i class="key-dash"></i>${t("est")}</span>` : ""}</div>`;
  const ph = M.heads > 1;
  return `<section class="zz edge card span2" aria-labelledby="h-cum">
    <div class="ch-head"><div class="hero-fig grow"><small id="h-cum">${esc(title)}</small><b class="display num">${fmt(M.total)}</b><p>${line}</p></div><button class="mini-btn" data-act="table" data-v="cum" aria-pressed="${!!S.tables.cum}">${S.tables.cum ? t("backChart") : t("numbers")}</button></div>
    ${body}
    <div class="stats ${ph ? "" : "one"}"><div><b class="num">${fmt(M.total / M.N)}</b><small>${t("perDay")}</small></div>${ph ? `<div><b class="num">${fmt(M.total / M.N / M.heads)}</b><small>${t("perHeadDay")}</small></div>` : ""}</div>
  </section>`;
}

function vCats(M) {
  const rows = M.byCat.filter(c => c.v !== 0).sort((a, b) => b.v - a.v);
  const max = Math.max(...rows.map(r => r.v), 1);
  let body;
  if (!rows.length) body = `<p class="note">${t("noData")}</p>`;
  else if (S.tables.cat) body = ntable([t("th_cat"), t("th_amt"), t("th_pct"), t("th_head")], rows.map(r => { const c = catOf(M.tr, r.id); return [`${c.emoji} ${c.name}`, fmt(r.v), pct(r.v / M.total), fmt(r.v / M.N / M.heads)]; }));
  else body = `<div class="cats">${rows.map((r, k) => {
    const c = catOf(M.tr, r.id), tx = txOf(c), key = `cat:${r.id}`;
    TIPS[key] = { t: `${c.emoji} ${c.name}`, v: fmt(r.v), rows: [{ c: c.color, l: t("nExp", r.n), v: pct(r.v / M.total) }, { c: c.color, l: t("perHeadDay"), v: fmt(r.v / M.N / M.heads) }], n: [r.top ? t("biggest", r.top.desc) : "", r.refunds ? t("netOfRefund", fmt(-r.refunds)) : ""].filter(Boolean) };
    return `<button class="catrow" data-tip="${key}" style="--c:var(--${c.color})" aria-label="${esc(`${c.name}: ${fmt(r.v)}, ${pct(r.v / M.total)}`)}"><span class="top"><span class="emo" aria-hidden="true">${c.emoji}</span><b>${esc(c.name)}</b><span class="num">${fmt(r.v)}<span class="pct">${pct(r.v / M.total)}</span></span></span><span class="hbar gx ${tx ? "tx-" + tx : ""}" style="width:${Math.max(0.6, (Math.max(0, r.v) / max) * 100).toFixed(2)}%;animation-delay:${k * 50}ms"></span></button>`;
  }).join("")}</div>`;
  return `<section class="zz edge card" aria-labelledby="h-cat">${cardHead("cat", t("c_cat"), esc(sub(M))).replace('class="display"', 'class="display" id="h-cat"')}${body}</section>`;
}

function vDays(M) {
  const cats = M.byCat.filter(c => c.v !== 0).map(c => ({ ...catOf(M.tr, c.id), v: c.v }));
  const head = S.dayMode === "head";
  const seg = `<div class="seg small" role="group">${[["group", t("dm_group")], ["head", t("dm_head")]].map(([k, l]) => `<button data-act="dm" data-v="${k}" aria-pressed="${S.dayMode === k}">${l}</button>`).join("")}</div>`;
  const subline = esc(head ? (M.heads > 1 ? t("dayHeadSub", M.heads) : sub(M)) : sub(M));
  const body = S.tables.day
    ? ntable([t("th_day"), t("th_that"), t("th_head")], M.days.slice(0, M.N).map((d, i) => [dDay(d), fmt(M.dayTot[i]), fmt(M.dayTot[i] / M.heads)]))
    : `<div class="chart" data-chart="days"></div>
       <div class="legend">${cats.map(c => { const tx = txOf(c); return `<span><i class="sw ${tx ? "tx-" + tx : ""}" style="--c:var(--${c.color})"></i>${c.emoji} ${esc(c.name)}${head ? ` <b class="num">${fmt(c.v / M.N / M.heads)}</b>` : ""}</span>`; }).join("")}</div>`;
  return `<section class="zz edge card" aria-labelledby="h-day">${cardHead("day", t("c_day"), subline).replace('class="display"', 'class="display" id="h-day"')}${seg}${body}</section>`;
}

function vRank(M) {
  const all = M.exps.filter(e => M.amt(e) > 0).sort((a, b) => M.amt(b) - M.amt(a)).slice(0, 10);
  const list = S.rankAll ? all : all.slice(0, 5);
  const max = all.length ? M.amt(all[0]) : 1;
  const rows = list.map((e, k) => {
    const c = catOf(M.tr, e.cat), tx = txOf(c), key = `rk:${e.id}`, a = M.amt(e);
    const payers = listNames(e.payers.map(p => nm(p[0])));
    const s = M.share(e), me = M.who || M.tr.me;
    TIPS[key] = { t: dDay(e.date), v: fmt(e.amount), rows: e.payers.map(([id, cc]) => ({ c: "hi", l: t("paidBy", nm(id)), v: fmt(cc) })), n: s[me] !== undefined ? t("partOfMe", nm(me), fmt(s[me])) : "" };
    return `<button class="rk" data-tip="${key}" style="--cat:var(--${c.color});--c:var(--${c.color})" aria-label="${esc(`${k + 1}. ${e.desc}: ${fmt(a)}`)}"><span class="pos num">${k + 1}</span><span class="cat-dot" aria-hidden="true">${c.emoji}</span>
      <span style="min-width:0"><span class="d">${esc(e.desc)}</span><span class="m">${esc(dDMs(e.date))}, ${esc(payers)}</span></span>
      <span class="a num">${fmt(a)}${M.who ? `<small>${esc(t("of", fmt(e.amount)))}</small>` : ""}</span>
      <span class="hbar gx ${tx ? "tx-" + tx : ""}" style="width:${((a / max) * 100).toFixed(2)}%;animation-delay:${k * 50}ms"></span></button>`;
  }).join("");
  return `<section class="zz edge card" aria-labelledby="h-rank">${cardHead(null, t("c_rank"), esc(M.who ? t("rankSub", nm(M.who)) : t("rankSubG"))).replace('class="display"', 'class="display" id="h-rank"')}
    ${all.length ? `<div class="rank">${rows}</div>${all.length > 5 ? `<button class="btn ghost sm" data-act="rank-all" style="justify-self:start">${S.rankAll ? t("rankLess") : t("rankMore", all.length)}</button>` : ""}` : `<p class="note">${t("noData")}</p>`}</section>`;
}

function vPvd(M) {
  const ids = M.tr.people.map(p => p.id);
  const max = Math.max(1, ...ids.map(id => Math.max(M.paid[id], M.due[id])));
  const P_ = v => ((Math.max(0, v) / max) * 100).toFixed(2);
  let body;
  if (S.tables.pvd) body = ntable([t("th_person"), t("th_paid"), t("th_due"), t("th_diff")], ids.map(id => [nm(id), fmt(M.paid[id]), fmt(M.due[id]), fmtS(M.paid[id] - M.due[id])]));
  else body = `<div class="pvd-key" aria-hidden="true"><span><i class="k-paid"></i>${t("k_paid")}</span><span><i class="k-due"></i>${t("k_due")}</span><span><i class="k-over"></i>${t("k_over")}</span><span><i class="k-short"></i>${t("k_short")}</span></div>
    <div class="pvd">${ids.map((id, k) => {
      const p = M.paid[id], d = M.due[id], diff = p - d, key = `pvd:${id}`;
      const words = diff > 0 ? t("pvdOver", fmt(diff)) : diff < 0 ? t("pvdShort", fmt(-diff)) : t("pvdEven");
      TIPS[key] = { t: nm(id), v: fmtS(diff), rows: [{ c: "ink", l: t("k_paid"), v: fmt(p) }, { c: "ink-2", l: t("k_due"), v: fmt(d) }], n: words };
      const bars = diff >= 0
        ? `<i class="paid gx" style="width:${P_(d)}%"></i><i class="over gx" style="left:${P_(d)}%;width:${(P_(p) - P_(d)).toFixed(2)}%;animation-delay:.25s"></i>`
        : `<i class="paid gx" style="width:${P_(p)}%"></i><i class="short gx" style="left:${P_(p)}%;width:${(P_(d) - P_(p)).toFixed(2)}%;animation-delay:.25s"></i>`;
      return `<button class="pr ${M.who && M.who !== id ? "dim" : ""}" data-tip="${key}" aria-label="${esc(`${nm(id)}: ${t("k_paid")} ${fmt(p)}, ${t("k_due")} ${fmt(d)}`)}">
        <span class="top">${avatar(id)}<b>${esc(nm(id))}</b><span class="num ${diff > 0 ? "amt-pos" : diff < 0 ? "amt-neg" : "amt-zero"}">${fmtS(diff)}</span></span>
        <span class="track">${bars}<i class="due" style="left:${P_(d)}%"></i></span><span class="words">${esc(words)}</span></button>`;
    }).join("")}</div>`;
  return `<section class="zz edge card" aria-labelledby="h-pvd">${cardHead("pvd", t("c_pvd"), esc(M.who ? t("subHl", nm(M.who)) : t("pvdNote"))).replace('class="display"', 'class="display" id="h-pvd"')}${body}${M.who ? `<p class="note">${t("pvdNote")}</p>` : ""}</section>`;
}

/* ---- chart 5: person x category, a heat table ---- */
function matrix(M) {
  const ids = M.tr.people.map(p => p.id);
  const cats = M.cats.filter(c => M.exps.some(e => e.cat === c));
  const v = {}; cats.forEach(c => (v[c] = Object.fromEntries(ids.map(id => [id, 0]))));
  M.exps.forEach(e => { const s = M.share(e); for (const id in s) if (v[e.cat]) v[e.cat][id] += s[id]; });
  let max = 1, best = null;
  cats.forEach(c => ids.forEach(id => { if (v[c][id] > max) { max = v[c][id]; best = { c, id }; } }));
  return { ids, cats, v, max, best };
}
function vMatrixTable(M, X_) {
  const cell = (c, id) => {
    const val = X_.v[c][id], cc = catOf(M.tr, c), key = `mat:${c}:${id}`;
    if (val <= 0) return `<td class="${M.who === id ? "hl" : ""}"><button class="zero" data-tip="${key}" aria-label="${esc(`${nm(id)}, ${cc.name}: ${fmt(val)}`)}">${val < 0 ? fmt0(val) : "0"}</button></td>`;
    const p = 10 + 82 * (val / X_.max);
    TIPS[key] = { t: `${nm(id)}, ${cc.emoji} ${cc.name}`, v: fmt(val), rows: [{ c: cc.color, l: t("ofPart", pct(val / M.due[id])), v: "" }, ...(M.headsOf(id) > 1 ? [{ c: cc.color, l: t("perHead", fmt(val / M.headsOf(id))), v: "" }] : [])] };
    return `<td class="${M.who === id ? "hl" : ""}"><button class="${p > 56 ? "inv" : ""}" data-tip="${key}" style="--h:color-mix(in srgb, var(--lead) ${p.toFixed(0)}%, var(--receipt))" aria-label="${esc(`${nm(id)}, ${cc.name}: ${fmt(val)}`)}">${fmt0(val).replace(/\s?€/, "")}</button></td>`;
  };
  return `<div class="heat-wrap"><table class="heat"><thead><tr><th class="rowh"><span class="sr">${t("th_cat")}</span></th>${X_.ids.map(id => `<th class="${M.who === id ? "hl" : ""}" scope="col"><span>${esc(nm(id))}</span></th>`).join("")}</tr></thead>
    <tbody>${X_.cats.map(c => { const cc = catOf(M.tr, c); return `<tr><th class="rowh" scope="row">${cc.emoji} ${esc(cc.name)}</th>${X_.ids.map(id => cell(c, id)).join("")}</tr>`; }).join("")}</tbody>
    <tfoot><tr><th class="rowh" scope="row">${t("matTot")}</th>${X_.ids.map(id => `<td class="num">${fmt0(M.due[id]).replace(/\s?€/, "")}</td>`).join("")}</tr></tfoot></table></div>
    <div class="ramp"><span>${t("less")}</span><i></i><span>${t("more")}</span><span class="grow"></span><span>${S.lang === "it" ? "importi in €" : "amounts in €"}</span></div>`;
}

/* ---- postcards: what is one tap away, each with a stamp that previews it ---- */
function stampMatrix(M, X_) {
  const cw = 66 / X_.ids.length, ch = 82 / Math.max(X_.cats.length, 1);
  return `<svg viewBox="0 0 66 82" aria-hidden="true">${X_.cats.map((c, r) => X_.ids.map((id, k) => `<rect x="${(k * cw + 0.8).toFixed(1)}" y="${(r * ch + 0.8).toFixed(1)}" width="${(cw - 1.6).toFixed(1)}" height="${(ch - 1.6).toFixed(1)}" rx="1.5" style="fill:color-mix(in srgb, var(--lead) ${(8 + 84 * Math.max(0, X_.v[c][id]) / X_.max).toFixed(0)}%, var(--receipt))"/>`).join("")).join("")}</svg>`;
}
function stampBank(BM) {
  const n = BM.ids.length, rh = 82 / n, x = tm => ((tm - BM.t0) / (BM.t1 - BM.t0)) * 66, lo = Math.min(BM.lo, -1), hi = Math.max(BM.hi, 1);
  return `<svg viewBox="0 0 66 82" aria-hidden="true">${BM.ids.map((id, r) => {
    const yv = v => r * rh + 2 + ((rh - 4) * (hi - v)) / (hi - lo);
    let d = `M0 ${yv(0).toFixed(1)}`; BM.steps.forEach((st, k) => { if (k) d += `H${x(st.t).toFixed(1)}`; d += `V${yv(st.b[id]).toFixed(1)}`; }); d += `H${x(BM.tNow).toFixed(1)}`;
    const last = BM.steps[BM.steps.length - 1].b[id];
    return `<line x1="0" x2="66" y1="${yv(0).toFixed(1)}" y2="${yv(0).toFixed(1)}" style="stroke:var(--line)"/><path d="${d}" fill="none" style="stroke:var(--${last >= 0 ? "pos" : "neg"})" stroke-width="1.6"/>`;
  }).join("")}</svg>`;
}
function vPostcard(act, title, teaser, stamp) {
  return `<button class="postcard" data-act="${act}"><span style="min-width:0"><h3 class="display">${esc(title)}</h3><p>${teaser}</p><span class="go">${t("open")}${ic("caret-right")}</span></span><span class="stamp-mini">${stamp}</span></button>`;
}

function vFeed() {
  TIPS = {}; SCRUB = {};
  const M = model(), X_ = matrix(M), BM = bankModel(M);
  const matTeaser = X_.best ? esc(t("matTeaser", nm(X_.best.id), catOf(M.tr, X_.best.c).name, fmt(X_.v[X_.best.c][X_.best.id]))) : t("noData");
  const bankTeaser = BM.peak.id ? esc(t("bankTeaser", nm(BM.peak.id), fmt(BM.peak.v), dDM(isoDate(new Date(BM.peak.t))))) : t("bankNone");
  return `${vFilters()}<div class="feed">
    ${vHero(M)}
    <div class="stack" style="gap:12px">${vCats(M)}${vPostcard("open-mat", t("c_mat"), matTeaser, stampMatrix(M, X_))}</div>
    ${vDays(M)}
    ${vRank(M)}
    <div class="stack" style="gap:12px">${vPvd(M)}${vPostcard("open-bank", t("c_bank"), bankTeaser, stampBank(BM))}</div>
  </div>`;
}

function vOverlay() {
  TIPS = {}; SCRUB = {};
  const M = model();
  const head = title => `<header class="ov-head"><button class="iconbtn" data-act="close-ov" aria-label="${t("back")}">${ic("caret-left")}</button><h1 class="display">${esc(title)}</h1></header>`;
  if (S.overlay === "mat") {
    const X_ = matrix(M);
    return `<div class="overlay ${S.anim.push ? "push-in" : ""}" role="dialog" aria-label="${esc(t("c_mat"))}">${head(t("c_mat"))}<div class="scroll" data-scroll="ov">${vFilters()}
      <div class="ov-body"><p class="ov-lede">${esc(t("matSub"))}</p><section class="zz edge card">${vMatrixTable(M, X_)}</section></div></div></div>`;
  }
  const BM = bankModel(M);
  const lede = BM.bankId ? T[S.lang].bankLede(esc(nm(BM.bankId)), BM.bankDays, M.N, fmt(BM.peak.v), dDM(isoDate(new Date(BM.peak.t)))) : t("bankNone");
  const last = BM.steps[BM.steps.length - 1].b;
  const body = S.tables.bank
    ? ntable([t("th_person"), t("th_peak"), t("th_low"), t("th_now")], BM.ids.map(id => [nm(id), fmtS(Math.max(0, ...BM.steps.map(s => s.b[id]))), fmtS(Math.min(0, ...BM.steps.map(s => s.b[id]))), fmtS(last[id])]))
    : `<div class="chart" data-chart="bank"></div><div class="legend"><span><i class="sw" style="--c:color-mix(in srgb, var(--pos) 45%, var(--receipt))"></i>${S.lang === "it" ? "ha anticipato" : "fronted"}</span><span><i class="sw" style="--c:color-mix(in srgb, var(--neg) 40%, var(--receipt))"></i>${S.lang === "it" ? "deve" : "owes"}</span><span><i class="sw" style="--c:var(--ink);border-radius:50%"></i>${S.lang === "it" ? "pagamento tra voi" : "settlement"}</span></div>`;
  return `<div class="overlay ${S.anim.push ? "push-in" : ""}" role="dialog" aria-label="${esc(t("c_bank"))}">${head(t("c_bank"))}<div class="scroll" data-scroll="ov">${vFilters()}
    <div class="ov-body"><p class="ov-lede">${lede}</p><section class="zz edge card">${cardHead("bank", t("c_bank"), esc(t("bankSub")))}${body}</section></div></div></div>`;
}

function vApp() {
  const tr = trip();
  const tabs = [["spese", "receipt", t("tabSpese")], ["saldi", "scales", t("tabSaldi")], ["grafici", "chart-bar", t("tabGrafici")], ["viaggio", "suitcase-rolling", t("tabViaggio")]];
  return `${PATTERNS}<header class="tripbar">
      <button class="iconbtn" data-act="other" aria-label="${t("backHome")}">${ic("caret-left")}</button>
      <div class="grow"><h1 class="display">${esc(tr.name)}</h1><p>${esc(dRange(tr.from, tr.to))}</p></div>
      <span class="me-chip">${ic("users")}${esc(t("youAre", nm(tr.me)))}</span>
    </header>
    <div class="sync">${ic("cloud-check")}${t("savedLocal")}</div>
    <main class="scroll ${S.anim.grow ? "grow" : ""}" data-scroll="feed">${vFeed()}</main>
    <nav class="tabbar" aria-label="Quits">${tabs.map(([k, i, l]) => `<button data-act="${k === "grafici" ? "noop" : "other"}" ${k === "grafici" ? 'aria-current="page"' : ""}><span class="pill">${ic(i)}</span>${l}</button>`).join("")}</nav>
    ${S.overlay ? vOverlay() : ""}
    ${S.toast ? `<div class="toast" role="status"><span>${esc(S.toast)}</span></div>` : ""}
    <div class="tip" hidden></div>`;
}

/* ================= drawing, tooltips, scrubbing ================= */
function drawCharts() {
  const app = document.getElementById("app");
  const M = model();
  app.querySelectorAll(".chart[data-chart]").forEach(el => {
    const W = Math.max(240, Math.floor(el.clientWidth));
    const k = el.dataset.chart;
    el.innerHTML = k === "cum" ? drawCum(M, W) : k === "days" ? drawDays(M, W) : drawBank(M, W, bankModel(M));
  });
}
let tipKey = null;
function showTip(data, anchor, key) {
  const app = document.getElementById("app"), tip = app.querySelector(".tip");
  if (!tip || !data) return;
  tip.replaceChildren();
  const add = (cls, text, parent = tip) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; parent.appendChild(d); return d; };
  if (data.t) add("tt", data.t);
  if (data.v) add("tv", data.v);
  (data.rows || []).forEach(r => {
    const row = document.createElement("div"); row.className = "tr";
    const i = document.createElement("i"); i.style.setProperty("--c", `var(--${r.c})`); row.appendChild(i);
    const l = document.createElement("span"); l.textContent = r.l; row.appendChild(l);
    const b = document.createElement("b"); b.textContent = r.v || ""; row.appendChild(b);
    tip.appendChild(row);
  });
  [].concat(data.n || []).forEach(line => add("tn", line.charAt(0).toUpperCase() + line.slice(1)));
  const fresh = tip.hidden || tipKey !== key;
  tip.hidden = false; tipKey = key;
  if (fresh) { tip.classList.remove("show"); void tip.offsetWidth; tip.classList.add("show"); }
  const box = app.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const cx = anchor.left + anchor.width / 2 - box.left;
  let top = anchor.top - box.top - h - 10;
  if (top < 8) top = anchor.bottom - box.top + 12;
  tip.style.left = clamp(cx - w / 2, 8, box.width - w - 8) + "px";
  tip.style.top = clamp(top, 8, box.height - h - 8) + "px";
}
function hideTip() {
  const tip = document.querySelector("#app .tip"); if (tip) tip.hidden = true; tipKey = null;
  document.querySelectorAll("#app .xh").forEach(g => (g.style.display = "none"));
}
function tipFor(el) {
  const key = el.dataset.tip, data = TIPS[key];
  if (!data) return;
  let r = el.getBoundingClientRect();
  if (data.ay != null && el.ownerSVGElement) {
    const svg = el.ownerSVGElement, b = svg.getBoundingClientRect(), k = b.height / svg.viewBox.baseVal.height, ay = b.top + data.ay * k;
    r = { left: r.left, width: r.width, top: ay, bottom: ay };
  }
  showTip(data, r, key);
}
function scrubTo(hit, i) {
  const sc = SCRUB[hit.dataset.scrub]; if (!sc) return;
  sc.cur = i;
  const svg = hit.ownerSVGElement, b = svg.getBoundingClientRect(), k = b.width / svg.viewBox.baseVal.width, p = sc.at(i);
  const g = svg.querySelector(".xh");
  if (g) { g.style.display = ""; const l = g.querySelector("line"); l.setAttribute("x1", p.x); l.setAttribute("x2", p.x); const c = g.querySelector("circle"); if (c) { c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); } }
  const ax = b.left + p.x * k, ay = b.top + p.y * k;
  showTip(sc.tip(i), { left: ax, width: 0, top: ay, bottom: ay }, hit.dataset.scrub);
}
function scrubAt(hit, ev) {
  const sc = SCRUB[hit.dataset.scrub]; if (!sc) return;
  const svg = hit.ownerSVGElement, b = svg.getBoundingClientRect();
  scrubTo(hit, sc.index(((ev.clientX - b.left) * svg.viewBox.baseVal.width) / b.width));
}

/* ================= prototype control panel ================= */
const VARIANTS = [
  { id: "scelta", name: "Scelta", it: "La scelta dell'autore: palette di Ombrellone, font di Piscina. Bagel Fat One + Onest.", en: "The author's pick: Ombrellone's palette, Piscina's fonts. Bagel Fat One + Onest.", sw: ["#F0644C", "#FFC53D", "#2EA3D6"] },
  { id: "ombrellone", name: "Ombrellone", it: "Corallo davanti, sole e piscina di contorno. Bricolage Grotesque + Figtree.", en: "Coral up front, sun and pool around it. Bricolage Grotesque + Figtree.", sw: ["#F0644C", "#FFC53D", "#2EA3D6"] },
  { id: "piscina", name: "Piscina", it: "Azzurro piscina davanti, forme tonde e gommose. Bagel Fat One + Onest.", en: "Pool blue up front, round and squishy. Bagel Fat One + Onest.", sw: ["#1F9FD6", "#FFD04A", "#FF6B57"] },
  { id: "saluti", name: "Saluti da", it: "Cartolina stampata a due inchiostri su carta manila. Bowlby One + Atkinson Hyperlegible Next.", en: "A postcard printed in two inks on manila paper. Bowlby One + Atkinson Hyperlegible Next.", sw: ["#2443A0", "#F6B826", "#E95A3F"] },
];
function renderProto() {
  const el = document.getElementById("proto");
  const M = model();
  const v = VARIANTS.find(x => x.id === S.variant);
  const themeName = { system: t("system"), light: t("light"), dark: t("dark") }[S.theme];
  const dayLabel = M.N >= M.D ? `${dDay(M.today)}: ${t("ended")}` : t("dayN", dDay(M.today), M.N, M.D);
  const jumps = [["mid", "j_mid"], ["end", "j_end"], ["mat", "j_mat"], ["bank", "j_bank"], ["sara", "j_sara"], ["nums", "j_nums"]];
  el.innerHTML = `<summary class="proto-head"><span class="eq open" aria-hidden="true"><i></i><i></i></span><b class="grow">${t("protoTitle")}</b><span class="small muted">${v.name}, ${themeName}</span></summary>
  <div class="proto-body">
    <p>${t("protoNote")}</p>
    <div><h2>${t("today")}</h2><p class="daylabel">${esc(dayLabel)}</p><label class="sr" for="day">${t("today")}</label><input id="day" class="range" type="range" min="1" max="${M.D}" step="1" value="${M.N}" data-in="day"></div>
    <div><h2>${t("paceL")}</h2><div class="jump">${["last3", "all", "nolodge"].map(k => `<button data-act="pace" data-v="${k}" aria-pressed="${S.pace === k}">${t("pace_" + k)}</button>`).join("")}</div><p class="small muted" style="margin-top:6px;font-size:12.5px">${t("paceHelp")}</p></div>
    <div><h2>${t("variant")}</h2><div class="vlist">${VARIANTS.map(x => `<button class="vopt" data-act="variant" data-v="${x.id}" aria-pressed="${S.variant === x.id}"><span class="sw">${x.sw.map(c => `<i style="background:${c}"></i>`).join("")}</span><b>${x.name}</b><small>${x[S.lang]}</small></button>`).join("")}</div></div>
    <div><h2>${t("theme")}</h2><div class="seg">${["system", "light", "dark"].map(k => `<button data-act="theme" data-v="${k}" aria-pressed="${S.theme === k}">${t(k)}</button>`).join("")}</div></div>
    <div><h2>${t("lang")}</h2><div class="seg">${["it", "en"].map(l => `<button data-act="lang" data-v="${l}" aria-pressed="${S.lang === l}">${l === "it" ? "Italiano" : "English"}</button>`).join("")}</div></div>
    <div class="only-desk"><h2>${t("screen")}</h2><div class="seg">${[[false, t("phone")], [true, t("desktop")]].map(([k, l]) => `<button data-act="wide" data-v="${k}" aria-pressed="${S.wide === k}">${l}</button>`).join("")}</div></div>
    <div><h2>${t("colors")}</h2><button class="switch" data-act="texture"><span class="check" aria-pressed="${S.texture}">${ic("check")}</span>${t("textures")}</button><p class="small muted" style="margin-top:6px;font-size:12.5px">${t("texturesHelp")}</p></div>
    <div><h2>${t("goto")}</h2><div class="jump">${jumps.map(([k, l]) => `<button data-act="jump" data-v="${k}">${t(l)}</button>`).join("")}</div></div>
    <div class="lib"><h2>${t("libTitle")}</h2><p>${t("libA", CHART_LINES)}</p><p>${t("libB")}</p>
      <table><thead><tr>${T[S.lang].libH.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${T[S.lang].libRows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table><p>${t("libC")}</p></div>
    <div class="lib"><h2>${t("orderTitle")}</h2><p>${t("orderText")}</p></div>
  </div>`;
}

/* ================= render ================= */
let growTimer;
function render() {
  const app = document.getElementById("app");
  const keep = {};
  app.querySelectorAll("[data-scroll]").forEach(el => (keep[el.dataset.scroll] = el.scrollTop));
  const focusAct = document.activeElement && app.contains(document.activeElement) ? [document.activeElement.dataset.act, document.activeElement.dataset.v] : null;
  document.documentElement.lang = S.lang;
  document.querySelector(".device").classList.toggle("wide", S.wide);
  tipKey = null;
  app.innerHTML = vApp();
  app.querySelectorAll("[data-scroll]").forEach(el => { if (el.dataset.scroll in keep) el.scrollTop = keep[el.dataset.scroll]; });
  drawCharts();
  if (focusAct && focusAct[0]) { const f = app.querySelector(`[data-act="${focusAct[0]}"]${focusAct[1] != null ? `[data-v="${focusAct[1]}"]` : ""}`); if (f) f.focus({ preventScroll: true }); }
  clearTimeout(growTimer);
  if (S.anim.grow) growTimer = setTimeout(() => app.querySelector(".scroll.grow")?.classList.remove("grow"), 1400);
  S.anim = {};
  renderProto();
}
function applyLook() {
  const r = document.documentElement;
  r.dataset.variant = S.variant;
  if (S.theme === "system") delete r.dataset.theme; else r.dataset.theme = S.theme;
  try { localStorage.setItem("quits-proto-grafici", JSON.stringify({ variant: S.variant, theme: S.theme, lang: S.lang })); } catch (_) {}
}

/* ================= actions ================= */
let toastTimer;
const A = {
  variant: el => { S.variant = el.dataset.v; applyLook(); },
  theme: el => { S.theme = el.dataset.v; applyLook(); },
  lang: el => { S.lang = el.dataset.v; applyLook(); },
  wide: el => { S.wide = el.dataset.v === "true"; },
  pace: el => { S.pace = el.dataset.v; S.anim.grow = true; },
  texture: () => { S.texture = !S.texture; },
  who: el => { S.who = el.dataset.v || null; S.anim.grow = true; },
  dm: el => { S.dayMode = el.dataset.v; S.anim.grow = true; },
  table: el => { S.tables[el.dataset.v] = !S.tables[el.dataset.v]; S.anim.grow = true; },
  "rank-all": () => { S.rankAll = !S.rankAll; },
  "open-mat": () => { S.overlay = "mat"; S.anim.push = true; S.anim.grow = true; },
  "open-bank": () => { S.overlay = "bank"; S.anim.push = true; S.anim.grow = true; },
  "close-ov": () => { S.overlay = null; },
  noop: () => { S.overlay = null; },
  other: () => { S.toast = t("otherTab"); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 3600); },
  jump: el => ({
    mid: () => { S.day = 4; S.overlay = null; S.anim.grow = true; },
    end: () => { S.day = 8; S.overlay = null; S.anim.grow = true; },
    mat: () => { S.overlay = "mat"; S.anim.push = true; },
    bank: () => { S.overlay = "bank"; S.anim.push = true; S.anim.grow = true; },
    sara: () => { S.who = "p2"; S.anim.grow = true; },
    nums: () => { const on = !Object.values(S.tables).some(Boolean); ["cum", "cat", "day", "pvd", "bank"].forEach(k => (S.tables[k] = on)); },
  })[el.dataset.v](),
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (el) { if (el.closest(".proto") || el.closest("#app")) { A[el.dataset.act]?.(el); render(); } return; }
  const tipEl = ev.target.closest("[data-tip]");
  if (tipEl) { if (tipKey === tipEl.dataset.tip) hideTip(); else tipFor(tipEl); return; }
  if (!ev.target.closest("[data-scrub]")) hideTip();
});
document.addEventListener("input", ev => {
  if (ev.target.dataset.in === "day") { S.day = +ev.target.value; S.anim.grow = true; render(); document.getElementById("day")?.focus(); }
});
let scrubbing = null;
document.addEventListener("pointerdown", ev => { const h = ev.target.closest("[data-scrub]"); if (h) { scrubbing = h; scrubAt(h, ev); } });
document.addEventListener("pointermove", ev => { const h = ev.target.closest("[data-scrub]"); if (h && (ev.pointerType === "mouse" || scrubbing === h)) scrubAt(h, ev); });
document.addEventListener("pointerup", () => (scrubbing = null));
document.addEventListener("pointercancel", () => (scrubbing = null));
document.addEventListener("pointerout", ev => { if (ev.pointerType === "mouse" && ev.target.closest?.("[data-scrub]") && !ev.relatedTarget?.closest?.("[data-scrub]")) hideTip(); });
document.addEventListener("focusin", ev => {
  const s = ev.target.closest?.("[data-scrub]"); if (s && SCRUB[s.dataset.scrub]) { const sc = SCRUB[s.dataset.scrub]; scrubTo(s, sc.cur ?? sc.start); return; }
  const tEl = ev.target.closest?.("[data-tip]"); if (tEl && ev.target.matches(":focus-visible")) tipFor(tEl);
});
document.addEventListener("focusout", ev => { if (ev.target.closest?.("[data-tip],[data-scrub]")) hideTip(); });
document.addEventListener("keydown", ev => {
  const s = ev.target.closest?.("[data-scrub]");
  if (s && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")) { const sc = SCRUB[s.dataset.scrub]; ev.preventDefault(); scrubTo(s, clamp((sc.cur ?? sc.start) + (ev.key === "ArrowRight" ? 1 : -1), 0, sc.n - 1)); return; }
  if (ev.key === "Escape") { if (tipKey) hideTip(); else if (S.overlay) { S.overlay = null; render(); } }
});
document.addEventListener("scroll", () => { if (tipKey) hideTip(); }, true);

/* ================= boot ================= */
(function boot() {
  try { const s = JSON.parse(localStorage.getItem("quits-proto-grafici") || "null"); if (s) Object.assign(S, { variant: s.variant || S.variant, theme: s.theme || S.theme, lang: s.lang || S.lang }); } catch (_) {}
  const h = (location.hash || "").slice(1);
  if (VARIANTS.some(v => v.id === h)) S.variant = h;
  applyLook();
  const proto = document.getElementById("proto");
  if (matchMedia("(min-width: 761px)").matches) proto.open = true;
  proto.addEventListener("click", ev => { if (ev.target.closest("summary") && matchMedia("(min-width: 761px)").matches) ev.preventDefault(); });
  render();
  let lastW = 0, raf;
  new ResizeObserver(entries => { const w = Math.round(entries[0].contentRect.width); if (w !== lastW) { lastW = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { hideTip(); drawCharts(); }); } }).observe(document.getElementById("app"));
  document.fonts?.ready.then(() => drawCharts());
})();
</script>
